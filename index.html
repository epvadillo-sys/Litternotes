${monthExams.map(x=>`<div class="examRow"><div><b>📚 ${esc(x.subject)}</b><br><span class="small">📖 Temas: ${esc(x.topics||'Sin especificar')}</span></div><div class="examDate">📅 ${formatDM(x.date)}</div></div>`).join('')||'<div class="small">No hay exámenes registrados este mes.</div>'}</div>`;let monthEvents=[];Object.entries(S.events||{}).forEach(([date,items])=>{if(date.startsWith(`${y}-${String(m+1).padStart(2,'0')}-`)&&Array.isArray(items))items.forEach(e=>monthEvents.push({...e,date}))});monthEvents.sort((a,b)=>a.date.localeCompare(b.date));h+=`<div class="card examList"><h3 class="agendaTitle">📌 Eventos de ${monthName}</h3>${monthEvents.map(x=>`<div class="examRow"><div><b>${eventIcon(x.type)} ${esc(x.title)}</b><br><span class="small">${eventLabel(x.type)}</span></div><div class="examDate">📅 ${formatDM(x.date)}</div></div>`).join('')||'<div class="small">No hay eventos registrados este mes.</div>'}</div>`;return h}

function grades(){let vals=Object.values(S.grades).flat(),overall=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;return `<h1>Notas</h1><div class="card notesAddSubject"><button class="btn" style="background:#facc15;color:#111" onclick="addSubject()">➕ Añadir asignatura</button></div><div class="gradesTop"><div class="card" style="text-align:center"><div class="small">MEDIA TOTAL</div><div class="avg overallAvg">${overall.toFixed(2)}</div><div class="small">Media de todas las notas</div></div></div><div class="grid" style="margin-top:16px">${Object.entries(S.grades).map(([s,g])=>{let a=g.reduce((x,y)=>x+y,0)/g.length;let safe=esc(s).replace(/'/g,'&#39;');return `<div class="card subject"><h3 class="noteSubjectTitle">${esc(s)}</h3><div class="small">Media de la asignatura</div><div style="font-size:24px;font-weight:900">${a.toFixed(2)}</div><div>${g.map((n,i)=>`<span class="grade ${n<5?'bad':''}">${String(n).replace('.',',')} <button onclick="delGrade('${safe}',${i})">×</button></span>`).join('')}</div><div style="margin-top:10px"><button class="btn secondary" style="background:#facc15;color:#111" onclick="addGrade('${safe}')">➕ Añadir nota</button></div><div class="evo"><i style="width:${Math.min(100,a*10)}%"></i></div></div>`}).join('')||`<div class="card"><div class="small">Todavía no hay asignaturas.</div></div>`}</div>`}function addSubject(){let s=prompt('Nombre de la asignatura:');if(!s)return;s=s.trim();if(!s)return;if(!S.grades[s])S.grades[s]=[];save();render()}function addGrade(subject){let s=subject||prompt('Asignatura:','Matemáticas');if(!s)return;let n=parseFloat(prompt('Nota:','7'));if(Number.isNaN(n))return;(S.grades[s]??=[]).push(n);save();render()}function delGrade(s,i){S.grades[s].splice(i,1);if(!S.grades[s].length)delete S.grades[s];save();render()}function tasks(){return `<h1>Tareas</h1>${card('<div class="row"><button class="btn" onclick="addTask()">➕ Nueva tarea</button></div><div class="taskList" style="margin-top:12px">'+(S.tasks.map((x,i)= function addTask(){let title=prompt('Tarea:');if(!title)return;let subject=prompt('Asignatura:','');if(subject===null)return;openDateModal((due)=>{S.tasks.push({title,subject,due:due?formatDM(due):'',done:false});save();render()})}

function draw(){return `<h1>Dibujo</h1>${card('<div class="row"><button class="btn" onclick="selectTool(\'pen\')">✏️ Lápiz</button><button class="btn secondary" onclick="selectTool(\'line\')">╱ Líneas</button><select id="lineType" class="field"><option value="straight">Línea recta</option><option value="arrow">Línea con flecha</option><option value="free">Línea a mano alzada</option></select><button class="btn secondary" onclick="selectTool(\'shape\')">⬜ Figuras</button><select id="shapeType" class="field shapeTools" onchange="selectShape(this.value)"><option value="circle">Círculo</option><option value="square">Cuadrado</option><option value="rectangle">Rectángulo</option><option value="triangle">Triángulo</option><option value="rhombus">Rombo</option><option value="pentagon">Pentágono</option><option value="hexagon">Hexágono</option><option value="spiral">🌀 Espiral</option><option value="star">⭐ Estrella</option><option value="flower">🌸 Flor</option><option value="heart">❤️ Corazón</option><option value="wave">〰️ Onda</option><option value="cloud">☁️ Nube</option><option value="petals">🌺 Pétalos</option></select><button class="btn secondary" onclick="selectTool(\'fill\')">🪣 Relleno</button><button class="btn secondary" onclick="selectTool(\'erase\')">🧽 Borrador</button><button class="btn secondary" onclick="clearCanvas()">🗑️ Limpiar</button><input id="drawColor" type="color" value="#111111"><label class="small">Grosor <input id="drawSize" type="range" min="1" max="30" value="4"></label></div><canvas id="canvas" class="draw"></canvas>')}`}
let tool='pen',drawing=false,startPt=null,baseImage=null,lineType='straight',shapeType='circle';
function selectTool(t){tool=t;if(t==='line')lineType=el('#lineType')?.value||lineType;if(t==='shape')shapeType=el('#shapeType')?.value||shapeType}

c.onpointermove=e=>{if(!drawing)return;let p=pt(e);if(tool==='pen'||tool==='erase'||(tool==='line'&&lineType==='free')){x.strokeStyle=tool==='erase'?'rgba(255,255,255,1)':el('#drawColor').value;x.lineWidth=(+el('#drawSize').value);x.lineCap='round';x.lineJoin='round';x.lineTo(p.x,p.y);x.stroke();return}x.putImageData(baseImage,0,0);drawPreview(x,startPt,p)};
c.onpointerup=e=>{if(!drawing)return;let p=pt(e);if(tool==='line'||tool==='shape'){x.putImageData(baseImage,0,0);drawPreview(x,startPt,p)}drawing=false;startPt=null;baseImage=null};c.onpointercancel=()=>{drawing=false;startPt=null;baseImage=null};}
function drawPreview(x,a,b){x.strokeStyle=el('#drawColor').value;x.lineWidth=+el('#drawSize').value;x.lineCap='round';x.lineJoin='round';x.beginPath();let x0=a.x,y0=a.y,x1=b.x,y1=b.y,w=x1-x0,h=y1-y0,cx=(x0+x1)/2,cy=(y0+y1)/2,rx=Math.abs(w)/2,ry=Math.abs(h)/2;if(tool==='line'){x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);if(lineType==='arrow'){let ang=Math.atan2(h,w),len=14;x.moveTo(b.x,b.y);x.lineTo(b.x-Math.cos(ang-.45)*len,b.y-Math.sin(ang-.45)*len);x.moveTo(b.x,b.y);x.lineTo(b.x-Math.cos(ang+.45)*len,b.y-Math.sin(ang+.45)*len)}}else if(shapeType==='circle'){x.ellipse(cx,cy,rx,ry,0,0,Math.PI*2)}else if(shapeType==='rectangle'){x.rect(Math.min(x0,x1),Math.min(y0,y1),Math.abs(w),Math.abs(h))}else if(shapeType==='square'){let side=Math.max(Math.abs(w),Math.abs(h));x.rect(x0,y0,side*(w<0?-1:1),side*(h<0?-1:1))}else if(['triangle','rhombus','pentagon','hexagon'].includes(shapeType)){let n={triangle:3,rhombus:4,pentagon:5,hexagon:6}[shapeType],rrx=rx,rry=ry;for(let i=0;i<n;i++){let ang=-Math.PI/2+i*2*Math.PI/n,px=cx+rrx*Math.cos(ang),py=cy+rry*Math.sin(ang);i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath()}else if(shapeType==='spiral'){for(let t=0;t<=Math.PI*5;t+=.08){let r=(t/(Math.PI*5))*Math.min(rx,ry),px=cx+r*Math.cos(t),py=cy+r*Math.sin(t);t===0?x.moveTo(px,py):x.lineTo(px,py)}}else if(shapeType==='star'){for(let i=0;i<10;i++){let r=i%2?Math.min(rx,ry)*.42:Math.min(rx,ry),ang=-Math.PI/2+i*Math.PI/5,px=cx+r*Math.cos(ang),py=cy+r*Math.sin(ang);i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath()}else if(shapeType==='flower'||shapeType==='petals'){let petals=shapeType==='flower'?5:8;for(let i=0;i<=petals*20;i++){let t=i*Math.PI*2/(petals*20),r=Math.min(rx,ry)*(.55+.28*Math.sin(petals*t)),px=cx+rx*(r/Math.min(rx,ry))*Math.cos(t),py=cy+ry*(r/Math.min(rx,ry))*Math.sin(t);i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath()}else if(shapeType==='heart'){x.moveTo(cx,cy+ry*.75);for(let t=0;t<=Math.PI*2;t+=.06){let px=cx+rx*.9*Math.pow(Math.sin(t),3),py=cy-ry*(.55*Math.cos(t)-.28*Math.cos(2*t)-.1 function fillAt(px,py){let c=el('#canvas'),ctx=c.getContext('2d',{willReadFrequently:true}),img=ctx.getImageData(0,0,c.width,c.height),d=img.data,w=c.width,h=c.height;if(px<0||py<0||px>=w||py>=h)return;let i=(py*w+px)*4,target=[d[i],d[i+1],d[i+2],d[i+3]],col=hexRgb(el('#drawColor').value);let transparent=target[3]===0;let tol=45;let same=j=>{if(transparent)return d[j+3]===0;return d[j+3]>0&&Math.abs(d[j]-target[0])+Math.abs(d[j+1]-target[1])+Math.abs(d[j+2]-target[2])+Math.abs(d[j+3]-target[3])<=tol};let q=[[px,py]],seen=new Uint8Array(w*h);while(q.length){let [cx,cy]=q.pop();if(cx<0||cy<0||cx>=w||cy>=h)continue;let k=cy*w+cx,j=k*4;if(seen[k])continue;seen[k]=1;if(!same(j))continue;d[j]=col[0];d[j+1]=col[1];d[j+2]=col[2];d[j+3]=255;q.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1])}ctx.putImageData(img,0,0)}function hexRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}function clearCanvas(){let c=el('#canvas');if(c)c.getContext('2d').clearRect(0,0,c.width,c.height)}

function bindClassImage(){let input=el('#classImg');if(!input)return;input.onchange=e=>{let file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){alert('Selecciona una imagen.');return}let reader=new FileReader();reader.onload=()=>{let src=reader.result;let img=new Image();img.onload=()=>{let max=1400,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*scale),h=Math.round(img.naturalHeight*scale),cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);S.classImage=cv.toDataURL('image/jpeg',.85);save();render()};img.src=src};reader.readAsDataURL(file)}}
let audioCtx=null,masterGain=null,bassFilter=null,trebleFilter=null,audioSource=null;
function setupAudioFX(){
  try{
    if(!audioCtx){
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      audioSource=audioCtx.createMediaElementSource(audio);
      bassFilter=audioCtx.createBiquadFilter(); bassFilter.type='lowshelf'; bassFilter.frequency.value=180;
      trebleFilter=audioCtx.createBiquadFilter(); trebleFilter.type='highshelf'; trebleFilter.frequency.value=3500;
      masterGain=audioCtx.createGain(); masterGain.gain.value=Number(el('#volumeMusic')?.value||.8);
      audioSource.connect(bassFilter).connect(trebleFilter).connect(masterGain).connect(audioCtx.destination);
    }
    if(audioCtx.state==='suspended')audioCtx.resume();
    if(el('#volumeMusic'))el('#volumeMusic').value=String(masterGain.gain.value);
    if(el('#bassMusic'))el('#bassMusic').value=String(bassFilter.gain.value);
    if(el('#trebleMusic'))el('#trebleMusic').value=String(trebleFilter.gain.value);
  }catch(e){console.warn('Audio FX no disponible',e)}
}
function setBass(v){if(!audioCtx)setupAudioFX();if(bassFilter)bassFilter.gain.value=Number(v)||0}
function setTreble(v){if(!audioCtx)setupAudioFX();if(trebleFilter)trebleFilter.gain.value=Number(v)||0}

function projectModal(type,index){let p=index>=0?S.projects[type][index]:{title:'',content:'',from:new Date().toISOString().slice(0,10),to:new Date().toISOString().slice(0,10)};let wrap=document.createElement('div');wrap.id='projectModal';wrap.className='dateModal';wrap.innerHTML=`<div class="dateBox" style="min-width:min(650px,94vw)"><h3>${index>=0?'✏️ Editar':'➕ Nuevo'} proyecto</h3><label class="small">Título del proyecto</label><input id="projectTitle" class="field full" value="${esc(p.title)}" style="margin:5px 0 12px"><label class="small">Contenido del proyecto</label><textarea id="projectContent" class="field full projectText" placeholder="Escribe aquí el contenido del proyecto..." style="margin:5px 0 12px">${esc(p.content)}</textarea><div class="grid"><div><label class="small">Fecha desde</label><input id="projectFrom" class="field full" type="date" value="${p.from||''}"></div><div><label class="small">Fecha hasta</label><input id="projectTo" class="field full" type="date" value="${p.to||''}"></div></div><div class="dateActions"><button class="btn secondary" id="cancelProject">Cancelar</button><button class="btn" id="saveProject">Guardar</button></div></div>`;document.body.appendChild(wrap);el('#projectTitle').focus();el('#cancelProject').onclick=()=>wrap.remove();el('#saveProject').onclick=()=>{let title=el('#projectTitle').value.trim(),content=el('#projectContent').value.trim(),from=el('#projectFrom').value,to=el('#projectTo').value;if(!title||!from||!to){alert('Completa título y fechas.');return}if(to<from){alert('La fecha hasta no puede ser anterior a la fecha desde.');return}let obj={title,content,from,to};if(index>=0)S.projects[type][index]=obj;else S.projects[type].push(obj);save();wrap.remove();render()}}
function addProject(type){projectModal(type,-1)}function editProject(type,i){projectModal(type,i)}function delProject(type,i){if(confirm('¿Eliminar este proyecto?')){S.projects[type].splice(i,1);save();render()}}

function geoAllPool(){let p=[];Object.entries(GEO.capitals).forEach(([cont,arr])=>arr.forEach(([country,capital])=>p.push({id:`cap|${country}`,type:'Capitales',question:`¿Cuál es la capital de ${country}?`,answer:capital,source:arr.map(x=>x[1])})));GEO.ccaa.forEach(([name,cap])=>p.push({id:`ccaa|${name}`,type:'Comunidades',question:`¿Cuál es la capital de ${name}?`,answer:cap,source:GEO.ccaa.map(x=>x[1])}));GEO.rivers.forEach(([river,prov])=>{let ps=prov.split(/, | y /).map(x=>x.trim()).filter(Boolean);ps.forEach(pr=>p.push({id:`river|${river}|${pr}`,type:'Ríos',question:`¿Por qué provincia pasa el río ${river}?`,answer:pr,source:Array.from(new Set(GEO.rivers.flatMap(r=>r[1].split(/, | y /).map(x=>x.trim()))))}));});Object.entries(GEO.bodyParts).forEach(([part,v])=>['músculos','órganos','huesos'].forEach(cat=>v[cat].forEach(item=>{let all=Object.values(GEO.bodyParts).flatMap(z=>z[cat]);if(all.length>1)p.push({id:`body|${part}|${cat}|${item}`,type:'Cuerpo humano',question:`¿Cuál de estos ${cat} pertenece a ${part}?`,answer:item,source:all})})));GEO.chemistry.forEach(([name,symbol])=>p.push({id:`chem|${name}`,type:'Química',question:`¿Cuál es el símbolo químico de ${name}?`,answer:symbol,source:GEO.chemistry.map(x=>x[1])}));GEO.demonyms.forEach(([country,demo])=>p.push({id:`gent|${country}`,type:'Gentilicios',question:`¿Cuál es el gentilicio de ${country}?`,answer:demo,source:GEO.demonyms.map(x=>x[1])}));return p}

  function firstUpper(v){v=String(v??'');return v?v.charAt(0).toLocaleUpperCase('es-ES')+v.slice(1):v}

  window.home=function(){
    const d=days[(new Date().getDay()+6)%7];

<script>

<script>
(function(){
  // v41: reparación definitiva de los tres bloques de Supergeografía.
  function cleanText(v){return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();}
  function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  function renderStableBlock(id, rows, questionIndex, answerIndex){
    const qEl=el('#'+id+'Question'), oEl=el('#'+id+'Options');
    if(!qEl||!oEl||!Array.isArray(rows)||rows.length<4)return false;
    const row=rows[Math.floor(Math.random()*rows.length)];
    const question=String(row[questionIndex]??'');
    const answer=String(row[answerIndex]??'');
    const pool=[]; for(const r of shuffle(rows)){const v=String(r[answerIndex]??'');if(v!==answer&&!pool.includes(v))pool.push(v);if(pool.length===3)break;}
    const options=shuffle([answer,...pool]);
    qEl.textContent=question;
    oEl.innerHTML='';
    options.forEach(option=>{
      const b=document.createElement('button');b.type='button';b.className='btn secondary geoV41Answer';b.textContent=String(option).charAt(0).toUpperCase()+String(option).slice(1);
      b.addEventListener('click',function(){
        oEl.querySelectorAll('button').forEach(x=>x.disabled=true);
        const ok=cleanText(this.textContent)===cleanText(answer);
        this.classList.add(ok?'correct':'wrong');
        const result=oEl.parentElement.querySelector('.geoResult');
        if(result)result.textContent=ok?'✅ ¡Correcto!':'❌ Incorrecto. Respuesta: '+(String(answer).charAt(0).toUpperCase()+String(answer).slice(1));
      });
      oEl.appendChild(b);
    });
    return true;
  }
  function repairSupergeo(){
    // Los datos de estos tres bloques tienen estructuras diferentes: [país,gentilicio], [respuesta,pregunta,respuesta] y [respuesta,pregunta,respuesta].
    renderStableBlock('geoGent',GEO.demonyms,0,1);
    renderStableBlock('geoHist',GEO.history,1,2);
    renderStableBlock('geoInst',GEO.instruments,1,2);
  }
  window.geoGent=()=>renderStableBlock('geoGent',GEO.demonyms,0,1);
  window.geoHistory=()=>renderStableBlock('geoHist',GEO.history,1,2);
  window.geoInstrument=()=>renderStableBlock('geoInst',GEO.instruments,1,2);
  const renderBefore41=window.render;
  window.render=function(){
    renderBefore41();
    if(S.section==='supergeo')requestAnimationFrame(repairSupergeo);
  };
  // Varios: títulos negros y en negrita, como se solicita.
  const st=document.createElement('style');st.textContent='.variosBlockTitle{color:#000!important;font-weight:800!important;}';document.head.appendChild(st);
})();
</script>
