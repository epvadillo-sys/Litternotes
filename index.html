function drawPreview(x,a,b){x.strokeStyle=el('#drawColor').value;x.lineWidth=+el('#drawSize').value;x.lineCap='round';x.lineJoin='round';x.beginPath();let x0=a.x,y0=a.y,x1=b.x,y1=b.y,w=x1-x0,h=y1-y0,cx=(x0+x1)/2,cy=(y0+y1)/2,rx=Math.abs(w)/2,ry=Math.abs(h)/2;if(tool==='line'){x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);if(lineType==='arrow'){let ang=Math.atan2(h,w),len=14;x.moveTo(b.x,b.y);x.lineTo(b.x-Math.cos(ang-.45)*len,b.y-Math.sin(ang-.45)*len);x.moveTo(b.x,b.y);x.lineTo(b.x-Math.cos(ang+.45)*len,b.y-Math.sin(ang+.45)*len)}}else if(shapeType==='circle'){x.ellipse(cx,cy,rx,ry,0,0,Math.PI*2)}else if(shapeType==='rectangle'){x.rect(Math.min(x0,x1),Math.min(y0,y1),Math.abs(w),Math.abs(h))}else if(shapeType==='square'){let side=Math.max(Math.abs(w),Math.abs(h));x.rect(x0,y0,side*(w<0?-1:1),side*(h<0?-1:1))}else if(['triangle','rhombus','pentagon','hexagon'].includes(shapeType)){let n={triangle:3,rhombus:4,pentagon:5,hexagon:6}[shapeType],rrx=rx,rry=ry;for(let i=0;i<n;i++){let ang=-Math.PI/2+i*2*Math.PI/n,px=cx+rrx*Math.cos(ang),py=cy+rry*Math.sin(ang);i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath()}else if(shapeType==='spiral'){for(let t=0;t<=Math.PI*5;t+=.08){let r=(t/(Math.PI*5))*Math.min(rx,ry),px=cx+r*Math.cos(t),py=cy+r*Math.sin(t);t===0?x.moveTo(px,py):x.lineTo(px,py)}}else if(shapeType==='star'){for(let i=0;i<10;i++){let r=i%2?Math.min(rx,ry)*.42:Math.min(rx,ry),ang=-Math.PI/2+i*Math.PI/5,px=cx+r*Math.cos(ang),py=cy+r*Math.sin(ang);i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath()}else if(shapeType==='flower'||shapeType==='petals'){let petals=shapeType==='flower'?5:8;for(let i=0;i<=petals*20;i++){let t=i*Math.PI*2/(petals*20),r=Math.min(rx,ry)*(.55+.28*Math.sin(petals*t)),px=cx+rx*(r/Math.min(rx,ry))*Math.cos(t),py=cy+ry*(r/Math.min(rx,ry))*Math.sin(t);i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath()}else if(shapeType==='heart'){x.moveTo(cx,cy+ry*.75);for(let t=0;t<=Math.PI*2;t+=.06){let px=cx+rx*.9*Math.pow(Math.sin(t),3),py=cy-ry*(.55*Math.cos(t)-.28*Math.cos(2*t)-.1 function fillAt(px,py){let c=el('#canvas'),ctx=c.getContext('2d',{willReadFrequently:true}),img=ctx.getImageData(0,0,c.width,c.height),d=img.data,w=c.width,h=c.height;if(px<0||py<0||px>=w||py>=h)return;let i=(py*w+px)*4,target=[d[i],d[i+1],d[i+2],d[i+3]],col=hexRgb(el('#drawColor').value);let transparent=target[3]===0;let tol=45;let same=j=>{if(transparent)return d[j+3]===0;return d[j+3]>0&&Math.abs(d[j]-target[0])+Math.abs(d[j+1]-target[1])+Math.abs(d[j+2]-target[2])+Math.abs(d[j+3]-target[3])<=tol};let q=[[px,py]],seen=new Uint8Array(w*h);while(q.length){let [cx,cy]=q.pop();if(cx<0||cy<0||cx>=w||cy>=h)continue;let k=cy*w+cx,j=k*4;if(seen[k])continue;seen[k]=1;if(!same(j))continue;d[j]=col[0];d[j+1]=col[1];d[j+2]=col[2];d[j+3]=255;q.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1])}ctx.putImageData(img,0,0)}function hexRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}function clearCanvas(){let c=el('#canvas');if(c)c.getContext('2d').clearRect(0,0,c.width,c.height)}

let swInt,swT=0,swOn=false,tmInt,tmT=300;function swStart(){if(swOn)return;swOn=true;let st=Date.now()-swT;swInt=setInterval(()=>{swT=Date.now()-st;if(el('#sw'))el('#sw').textContent=fmtSW(swT)},200)}function swPause(){swOn=false;clearInterval(swInt)}function swReset(){swPause();swT=0;if(el('#sw'))el('#sw').textContent='00:00:00'}function setM(n){tmT=n*60;updateTm()}function tmStart(){clearInterval(tmInt);tmInt=setInterval(()=>{if(tmT<=0){clearInterval(tmInt);alert('⏰ ¡Tiempo terminado!');return}tmT--;updateTm()},1000)}function tmPause(){clearInterval(tmInt)}function tmReset(){tmPause();tmT=+el('#mins').value*60||0;updateTm()}function updateTm(){if(el('#tm'))el('#tm').textContent=fmtSW(tmT*1000)}
const zoneMap={'Madrid':'Europe/Madrid','Londres':'Europe/London','Nueva York':'America/New_York','Manila':'Asia/Manila','Tokio':'Asia/Tokyo','París':'Europe/Paris','Roma':'Europe/Rome','Berlín':'Europe/Berlin','Miami':'America/New_York','Los Ángeles':'America/Los_Angeles','México':'America/Mexico_City','Sídney':'Australia/Sydney'};function renderWorldClocks(){let e=el('#worldclocks');if(!e)return;let now=new Date();e.innerHTML=S.cities.map((c,i)=>{let tz=zoneMap[c]||'UTC';let t=now.toLocaleTimeString('es-ES',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:undefined,hour12:false}).slice(0,5);let date=now.toLocaleDateString('es-ES',{timeZone:tz,day:'2-digit',month:'2-digit'});return `<div class="item"><span>🌍 <b>${esc(c)}</b><br><span class="small">${date}</span></span><span class="clock worldtime">${t}</span><button class="btn danger" onclick="removeCity(${i})">×</button></div>`}).join('')}

function music(){return `<h1>Música <span class="musicHeartInline" id="musicHeart">❤️</span></h1>${card('<h3 class="musicTitle">🎵 Música local</h3><p>Selecciona archivos de audio desde tu ordenador. Cada archivo se carga una sola vez.</p><div class="row"><button class="btn" onclick="el(\'#musicFiles\').click()">🎵 Cargar archivos</button><button class="btn secondary" onclick="musicPlayPause()">▶ / ⏸</button><button class="btn secondary" onclick="musicPrev()">⏮</button><button class="btn secondary" onclick="musicNext()">⏭</button></div><div id="tracks" class="list" style="margin-top:12px">'+(S.music.length?S.music.map((m,i)=>`<div class="item"><span class="musicTrackTitle">🎵 ${esc(m.name)}</span><div class="row"><button class="btn" onclick="playTrack(${i})">▶</button><button class="btn musicDelete" onclick="delMusic(${i})">🗑️ Eliminar</button></div></div>`).join(''):'<div class="small">No hay canciones cargadas.</div>')+'</div><div class="eqPanel"><div class="eqControl"><div>🔊 Volumen</div><div class="eqKnob"></div><input id="volumeMusic" type="range" min="0" max="1" step=".01" value=".8"></div><div class="eqControl"><div>🎚️ Graves</div><div class="eqKnob"></div><input id="bassMusic" type="range" min="-12" max="12" value="0"></div><div class="eqControl"><div>🎚️ Agudos</div><div class="eqKnob"></div><input id="trebleMusic" type="range" min="-12" max="12" value="0"></div></div><div class="small" id="song2">Sin canción</div>')}`}

function playTrack(i){if(!S.music[i])return;track=i;const m=S.music[i];if(isIOSAudio){try{if(audioCtx){audio.pause();audio.src='';}}catch(e){} audio.src=m.url; audio.load(); const p=audio.play(); if(p&&p.catch)p.catch(e=>console.warn('Audio iPad:',e));}else{setupAudioFX();if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();audio.src=m.url;audio.load();const p=audio.play();if(p&&p.catch)p.catch(e=>console.warn('Audio:',e));}el('#musicArt')&&(el('#musicArt').textContent=['🎵','🎸','🎹','🎧','🥁'][i%5]);el('#song2')&&(el('#song2').textContent=m.name)}

function bindMusicFiles(){const input=el('#musicFiles');if(!input)return;input.onchange=e=>{const files=Array.from(e.target.files||[]);let added=0;for(const f of files){const key=f.name+'|'+f.size+'|'+f.lastModified;const exists=S.music.some(m=>(m.name+'|'+(m.size||0)+'|'+(m.lastModified||0))===key);if(!exists){S.music.push({name:f.name,size:f.size,lastModified:f.lastModified,type:f.type||'audio/mpeg',url:URL.createObjectURL(f)});added++;}}input.value='';if(added){save();render();}else if(files.length){alert('Ese archivo ya está cargado.');}}}

function pickGeo(a){return a[Math.floor(Math.random()*a.length)]}
function geoCapital(){let c=el('#geoContinent').value,a=GEO.capitals[c],q=pickGeo(a),opts=[q[1],...a.filter(x=>x[1]!==q[1]).sort(()=>Math.random()-.5).slice(0,3).map(x=>x[1])].sort(()=>Math.random()-.5);el('#geoCapQuestion').textContent=`¿Cuál es la capital de ${q[0]}?`;el('#geoCapOptions').innerHTML=opts.map(o=>`<button class="btn secondary" onclick="geoAnswer(this,'${esc(o).replace(/'/g,"\\'")}','${esc(q[1]).replace(/'/g,"\\'")}')">${esc(o)}</button>`).join('')}
function geoCCAA(){let q=pickGeo(GEO.ccaa),opts=[q[1],...GEO.ccaa.filter(x=>x[1]!==q[1]).sort(()=>Math.random()-.5).slice(0,3).map(x=>x[1])].sort(()=>Math.random()-.5);el('#geoCQuestion').textContent=`Elige la capital de ${q[0]}`;el('#geoCOptions').innerHTML=opts.map(o=>`<button class="btn secondary" onclick="geoAnswer(this,'${esc(o).replace(/'/g,"\\'")}','${esc(q[1]).replace(/'/g,"\\'")}')">${esc(o)}</button>`).join('')}
function geoRiver(){let q=pickGeo(GEO.rivers);let provinces=q[1].split(/, | y /).map(x=>x.trim()).filter(Boolean);let correct=provinces[Math.floor(Math.random()*provinces.length)];let all=Array.from(new Set(GEO.rivers.flatMap(r=>r[1].split(/, | y /).map(x=>x.trim()))));let opts=[correct,...all.filter(x=>x!==correct).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);el('#geoRQuestion').textContent=`¿Por qué provincia pasa el río ${q[0]}?`;el('#geoROptions').innerHTML=opts.map(o=>`<button class="btn secondary" onclick="geoAnswer(this,'${esc(o).replace(/'/g,"\\'")}','${esc(correct).replace(/'/g,"\\'")}')">${esc(o)}</button>`).join('')}
function geoAnswer(btn,a,correct){let box=btn.parentElement.nextElementSibling;if(a===correct){box.textContent='✅ Correcto';}else{box.textContent='❌ No. Respuesta: '+correct}setTimeout(()=>{if(btn.closest('.geoCard')?.id==='geoCap')geoCapital();else if(btn.closest('.geoCard')?.id==='geoCCAA')geoCCAA();else geoRiver()},900)}

function bindClassImage(){let input=el('#classImg');if(!input)return;input.onchange=e=>{let file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){alert('Selecciona una imagen.');return}let reader=new FileReader();reader.onload=()=>{let src=reader.result;let img=new Image();img.onload=()=>{let max=1400,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*scale),h=Math.round(img.naturalHeight*scale),cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);S.classImage=cv.toDataURL('image/jpeg',.85);save();render()};img.src=src};reader.readAsDataURL(file)}}
let audioCtx=null,masterGain=null,bassFilter=null,trebleFilter=null,audioSource=null;
function setupAudioFX(){
  try{
    if(!audioCtx){
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      audioSource=audioCtx.createMediaElementSource(audio);
      bassFilter=audioCtx.createBiquadFilter(); bassFilter.type='lowshelf'; bassFilter.frequency.value=180;
      trebleFilter=audioCtx.createBiquadFilter(); trebleFilter.type='highshelf'; trebleFilter.frequency.value=3500;
      masterGain=audioCtx.createGain(); masterGain.gain.value=Number(el('#volumeMusic')?.value||.8);
      audioSource.connect(bassFilter).connect(trebleFilter).connect(masterGain).connect(audioCtx.destination);
    }
    if(audioCtx.state==='suspended')audioCtx.resume();
    if(el('#volumeMusic'))el('#volumeMusic').value=String(masterGain.gain.value);
    if(el('#bassMusic'))el('#bassMusic').value=String(bassFilter.gain.value);
    if(el('#trebleMusic'))el('#trebleMusic').value=String(trebleFilter.gain.value);
  }catch(e){console.warn('Audio FX no disponible',e)}
}
function setBass(v){if(!audioCtx)setupAudioFX();if(bassFilter)bassFilter.gain.value=Number(v)||0}
function setTreble(v){if(!audioCtx)setupAudioFX();if(trebleFilter)trebleFilter.gain.value=Number(v)||0}

function projectModal(type,index){let p=index>=0?S.projects[type][index]:{title:'',content:'',from:new Date().toISOString().slice(0,10),to:new Date().toISOString().slice(0,10)};let wrap=document.createElement('div');wrap.id='projectModal';wrap.className='dateModal';wrap.innerHTML=`<div class="dateBox" style="min-width:min(650px,94vw)"><h3>${index>=0?'✏️ Editar':'➕ Nuevo'} proyecto</h3><label class="small">Título del proyecto</label><input id="projectTitle" class="field full" value="${esc(p.title)}" style="margin:5px 0 12px"><label class="small">Contenido del proyecto</label><textarea id="projectContent" class="field full projectText" placeholder="Escribe aquí el contenido del proyecto..." style="margin:5px 0 12px">${esc(p.content)}</textarea><div class="grid"><div><label class="small">Fecha desde</label><input id="projectFrom" class="field full" type="date" value="${p.from||''}"></div><div><label class="small">Fecha hasta</label><input id="projectTo" class="field full" type="date" value="${p.to||''}"></div></div><div class="dateActions"><button class="btn secondary" id="cancelProject">Cancelar</button><button class="btn" id="saveProject">Guardar</button></div></div>`;document.body.appendChild(wrap);el('#projectTitle').focus();el('#cancelProject').onclick=()=>wrap.remove();el('#saveProject').onclick=()=>{let title=el('#projectTitle').value.trim(),content=el('#projectContent').value.trim(),from=el('#projectFrom').value,to=el('#projectTo').value;if(!title||!from||!to){alert('Completa título y fechas.');return}if(to<from){alert('La fecha hasta no puede ser anterior a la fecha desde.');return}let obj={title,content,from,to};if(index>=0)S.projects[type][index]=obj;else S.projects[type].push(obj);save();wrap.remove();render()}}

<script>
/* ===== Litternotes v37: Supergeografía estable + Agenda eliminable ===== */
(function(){
  function makeGeoBlock(id,title,question,items,answerIndex){
    const q=items[Math.floor(Math.random()*items.length)];
    const answer=q[answerIndex];
    const pool=items.map(x=>x[answerIndex]);
    const opts=[answer,...pool.filter(x=>x!==answer).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);
    const qEl=el('#'+id+'Question'),oEl=el('#'+id+'Options'); if(!qEl||!oEl)return;
    qEl.textContent=question(q);
    oEl.innerHTML=opts.map(o=>`<button type="button" class="btn secondary geoStableAnswer">${esc(firstUpper(o))}</button>`).join('');
    oEl.querySelectorAll('button').forEach(b=>b.onclick=function(){
      const ok=this.textContent.trim().toLowerCase()===firstUpper(answer).toLowerCase();
      oEl.querySelectorAll('button').forEach(x=>x.disabled=true);
      this.classList.add(ok?'correct':'wrong');
      const res=oEl.parentElement.querySelector('.geoResult'); if(res)res.textContent=ok?'✅ ¡Correcto!':'❌ Incorrecto. Respuesta: '+firstUpper(answer);
    });
  }
  window.geoGent=function(){makeGeoBlock('geoGent','Gentilicios',q=>`¿Cuál es el gentilicio de ${q[0]}?`,GEO.demonyms,1)};
  window.geoHist=function(){makeGeoBlock('geoHist','Historia',q=>q[1],GEO.history,0)};
  window.geoInst=function(){makeGeoBlock('geoInst','Instrumentos',q=>q[1],GEO.instruments,0)};

  // Rebind only these three blocks after Supergeografía renders; other blocks remain untouched.
  const oldSuper=window.supergeo;
  window.supergeo=function(){
    const h=oldSuper();
    setTimeout(()=>{geoGent();geoHist();geoInst()},0);
    return h;
  };

  // Agenda: every event/exam shown for the selected day can be removed individually,
  // and there is also a button to clear the complete day.
  window.deleteAgendaExam=function(index){
    if(!confirm('¿Eliminar este examen?'))return;
    S.exams=(S.exams||[]).filter((x,i)=>i!==index); save(); render();
  };
  window.deleteAgendaEvent=function(date,index){
    if(!confirm('¿Eliminar esta anotación?'))return;
    const a=Array.isArray(S.events?.[date])?S.events[date]:[]; a.splice(index,1);
    if(a.length)S.events[date]=a; else delete S.events[date]; save(); render();
  };
  window.deleteAgendaDay=function(date){
    if(!confirm('¿Eliminar todo lo de este día?'))return;
    S.exams=(S.exams||[]).filter(x=>x.date!==date); if(S.events)delete S.events[date]; save(); render();
  };
  const oldAgenda=window.agenda;
  window.agenda=function(){
    let h=oldAgenda();
    const date=S.selectedDate;
    if(!date)return h;
    const exams=(S.exams||[]).map((x,i)=>({x,i})).filter(o=>o.x.date===date);
    const events=Array.isArray(S.events?.[date])?S.events[date]:[];
    if(!exams.length&&!events.length)return h;
    let html='<div class="card" style="margin-top:12px"><h3>🗑️ Eliminar anotaciones del día</h3>';
    exams.forEach(o=>html+=`<div class="item"><span>📚 ${esc(o.x.subject||o.x.title||'Examen')}</span><button type="button" class="btn secondary" onclick="deleteAgendaExam(${o.i})">🗑️ Eliminar</button></div>`);
    events.forEach((x,i)=>html+=`<div class="item"><span>${eventIcon(x.type)} ${esc(x.title||eventLabel(x.type))}</span><button type="button" class="btn secondary" onclick="deleteAgendaEvent('${date}',${i})">🗑️ Eliminar</button></div>`);
    html+=`<button type="button" class="btn" onclick="deleteAgendaDay('${date}')">🗑️ Eliminar todo este día</button></div>`;
    return h+html;
  };
})();
</script>

<script>
(function(){
  // v41: reparación definitiva de los tres bloques de Supergeografía.
  function cleanText(v){return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();}
  function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  function renderStableBlock(id, rows, questionIndex, answerIndex){
    const qEl=el('#'+id+'Question'), oEl=el('#'+id+'Options');
    if(!qEl||!oEl||!Array.isArray(rows)||rows.length<4)return false;
    const row=rows[Math.floor(Math.random()*rows.length)];
    const question=String(row[questionIndex]??'');
    const answer=String(row[answerIndex]??'');
    const pool=[]; for(const r of shuffle(rows)){const v=String(r[answerIndex]??'');if(v!==answer&&!pool.includes(v))pool.push(v);if(pool.length===3)break;}
    const options=shuffle([answer,...pool]);
    qEl.textContent=question;
    oEl.innerHTML='';
    options.forEach(option=>{
      const b=document.createElement('button');b.type='button';b.className='btn secondary geoV41Answer';b.textContent=String(option).charAt(0).toUpperCase()+String(option).slice(1);
      b.addEventListener('click',function(){
        oEl.querySelectorAll('button').forEach(x=>x.disabled=true);
        const ok=cleanText(this.textContent)===cleanText(answer);
        this.classList.add(ok?'correct':'wrong');
        const result=oEl.parentElement.querySelector('.geoResult');
        if(result)result.textContent=ok?'✅ ¡Correcto!':'❌ Incorrecto. Respuesta: '+(String(answer).charAt(0).toUpperCase()+String(answer).slice(1));
      });
      oEl.appendChild(b);
    });
    return true;
  }
  function repairSupergeo(){
    // Los datos de estos tres bloques tienen estructuras diferentes: [país,gentilicio], [respuesta,pregunta,respuesta] y [respuesta,pregunta,respuesta].
    renderStableBlock('geoGent',GEO.demonyms,0,1);
    renderStableBlock('geoHist',GEO.history,1,2);
    renderStableBlock('geoInst',GEO.instruments,1,2);
  }
  window.geoGent=()=>renderStableBlock('geoGent',GEO.demonyms,0,1);
  window.geoHistory=()=>renderStableBlock('geoHist',GEO.history,1,2);
  window.geoInstrument=()=>renderStableBlock('geoInst',GEO.instruments,1,2);
  const renderBefore41=window.render;
  window.render=function(){
    renderBefore41();
    if(S.section==='supergeo')requestAnimationFrame(repairSupergeo);
  };
  // Varios: títulos negros y en negrita, como se solicita.
  const st=document.createElement('style');st.textContent='.variosBlockTitle{color:#000!important;font-weight:800!important;}';document.head.appendChild(st);
})();
</script>

<script>
/* ===== v98: NOTAS - implementación única y definitiva ===== */
(function(){
  function parseGrade(v){
    if(v && typeof v==='object') v=v.value ?? v.nota ?? v.grade;
    let s=String(v==null?'':v).trim().replace(',', '.');
    if(!s) return null;
    let n=Number(s);
    if(!Number.isFinite(n)) return null;
    // Compatibilidad con datos antiguos guardados incorrectamente: 800 -> 8,00.
    if(n>10){
      if(n>=100 && n<=1000) n=n/100;
      else if(n>10 && n<100) n=n/10;
    }
    if(n<0 || n>10) return null;
    return Math.round(n*100)/100;
  }
  function fmt(n){ return Number(n).toFixed(2).replace('.',','); }
  function normalize(){
    if(!S.grades || typeof S.grades!=='object' || Array.isArray(S.grades)) S.grades={};
    let changed=false;
    Object.keys(S.grades).forEach(function(subject){
      let old=Array.isArray(S.grades[subject])?S.grades[subject]:[];
      let arr=old.map(parseGrade).filter(function(x){return x!==null;});
      if(JSON.stringify(arr)!==JSON.stringify(old)) changed=true;
      S.grades[subject]=arr;
    });
    if(changed) save();
  }
  function drawNotes(){
    if(S.section!=='grades') return;
    normalize();
    const page=el('#page'); if(!page) return;
    page.innerHTML='';
    const title=document.createElement('h1'); title.textContent='Notas'; page.appendChild(title);

    const addSubject=document.createElement('button');
    addSubject.type='button'; addSubject.className='btn'; addSubject.textContent='➕ Añadir asignatura';
    addSubject.onclick=function(){
      const name=(prompt('Nombre de la asignatura:','')||'').trim();
      if(!name) return;
      if(Object.prototype.hasOwnProperty.call(S.grades,name)){ alert('Esa asignatura ya existe.'); return; }
      S.grades[name]=[]; save(); drawNotes();
    };
    const top=document.createElement('div'); top.className='card'; top.appendChild(addSubject); page.appendChild(top);

    const subjects=Object.keys(S.grades);
    const all=[]; subjects.forEach(function(s){ all.push(...S.grades[s]); });
    const total=all.length ? all.reduce((a,b)=>a+b,0)/all.length : 0;
    const totalCard=document.createElement('div'); totalCard.className='gradesTop';
    totalCard.innerHTML='<div class="card" style="text-align:center"><div class="small">MEDIA TOTAL</div><div class="avg">'+fmt(total)+'</div></div>';
    page.appendChild(totalCard);

    const grid=document.createElement('div'); grid.className='grid'; grid.style.marginTop='16px'; page.appendChild(grid);
    if(!subjects.length){
      const empty=document.createElement('div'); empty.className='card'; empty.textContent='Todavía no hay asignaturas.'; grid.appendChild(empty); return;
    }

    subjects.forEach(function(subject){
      const arr=S.grades[subject];
      const card=document.createElement('div'); card.className='card subject';
      const h=document.createElement('h3'); h.textContent=subject; card.appendChild(h);
      const lab=document.createElement('div'); lab.className='small'; lab.textContent='Media de la asignatura'; card.appendChild(lab);
      const avg=document.createElement('div'); avg.style.cssText='font-size:24px;font-weight:900'; card.appendChild(avg);
      const list=document.createElement('div'); list.style.marginTop='12px'; card.appendChild(list);

      function updateAverage(){
        const nums=arr.map(parseGrade).filter(x=>x!==null);
        const a=nums.length?nums.reduce((x,y)=>x+y,0)/nums.length:0;
        avg.textContent=fmt(a);
      }

      arr.forEach(function(note,index){
        const row=document.createElement('div');
        row.style.cssText='display:flex;align-items:center;gap:7px;margin:8px 0;flex-wrap:wrap';
        const input=document.createElement('input');
        input.type='text'; input.inputMode='decimal'; input.className='field'; input.value=fmt(note);
        input.style.cssText='width:90px;font-weight:700;text-align:center';
        const edit=document.createElement('button'); edit.type='button'; edit.className='btn secondary'; edit.textContent='✏️ Modificar';
        edit.style.cssText='font-size:11px;padding:5px 8px';
        const del=document.createElement('button'); del.type='button'; del.className='btn danger'; del.textContent='🗑️ Eliminar';
        del.style.cssText='font-size:11px;padding:5px 8px';
        function modify(){
          const n=parseGrade(input.value);
          if(n===null){ alert('Introduce una nota válida entre 0,00 y 10,00.'); input.value=fmt(arr[index]); return; }
          arr[index]=n; S.grades[subject]=arr; save(); drawNotes();
        }
        edit.onclick=modify;
        input.addEventListener('change',modify);
        del.onclick=function(){
          if(!confirm('¿Eliminar esta nota?')) return;
          arr.splice(index,1); S.grades[subject]=arr; save(); drawNotes();
        };
        row.appendChild(input); row.appendChild(edit); row.appendChild(del); list.appendChild(row);
      });

      const add=document.createElement('button'); add.type='button'; add.className='btn secondary'; add.textContent='➕ Añadir nota'; add.style.marginTop='8px';
      add.onclick=function(){
        const raw=prompt('Nueva nota (ejemplo: 7,25):','7,00'); if(raw===null)return;
        const n=parseGrade(raw); if(n===null){alert('Introduce una nota válida entre 0,00 y 10,00.');return;}
        arr.push(n); S.grades[subject]=arr; save(); drawNotes();
      };
      card.appendChild(add); updateAverage(); grid.appendChild(card);
    });
  }

  window.grades=drawNotes;
  const previousRender=window.render;
  window.render=function(){
    // Para Notas NO se ejecutan los renderizadores antiguos: así ninguno puede sobrescribir esta versión.
    if(S.section==='grades'){ drawNotes(); return; }
    previousRender();
  };
  if(S.section==='grades') drawNotes();
})();
</script>

<script>

(function(){
  /* ---------- HORARIO: copiar el lunes a todos los demás días ---------- */
  if(!S.schedule || typeof S.schedule!=='object') S.schedule={};
  if(!S._v74ScheduleCopied){
    const monday=Array.isArray(S.schedule.Lunes)?S.schedule.Lunes.map(x=>Array.isArray(x)?x.slice():x):[];

  };

  /* ---------- RELOJ MUNDIAL: cuatro ciudades iniciales y eliminación real ---------- */
  const v74DefaultCities=[['Madrid','Europe/Madrid'],['Londres','Europe/London'],['Nueva York','America/New_York'],['Tokio','Asia/Tokyo']];
  const v74AllCities=[
    ...v74DefaultCities,
    ['Los Ángeles','America/Los_Angeles'],['Ciudad de México','America/Mexico_City'],['São Paulo','America/Sao_Paulo'],['Dubái','Asia/Dubai'],['Sídney','Australia/Sydney'],['Pekín','Asia/Shanghai'],['Roma','Europe/Rome'],['París','Europe/Paris'],['Manila','Asia/Manila'],['Singapur','Asia/Singapore']
  ];
  function v74Cities(){
    if(!Array.isArray(S.worldCities)||!S.worldCities.length){S.worldCities=v74DefaultCities.map(x=>x.slice());save();}
    /* Corrige únicamente la configuración antigua de cuatro ciudades que llevaba Los Ángeles en lugar de Tokio. */
    if(S.worldCities.length===4 && S.worldCities.some(x=>x&&x[0]==='Los Ángeles') && !S.worldCities.some(x=>x&&x[0]==='Tokio')){
      S.worldCities=v74DefaultCities.map(x=>x.slice());save();
    }
    return S.worldCities;
  }
  window.addWorldCityV74=function(){
    const current=v74Cities();
    const available=v74AllCities.filter(c=>!current.some(x=>x[0]===c[0]));
    if(!available.length){alert('No hay más ciudades disponibles para añadir.');return;}
    const names=available.map((c,i)=>`${i+1}. ${c[0]}`).join('\n');
    const n=prompt('Escribe el número de la ciudad que quieres añadir:\n\n'+names);

    const idx=Number(n)-1;
    if(!Number.isInteger(idx)||!available[idx]){alert('Número no válido.');return;}
    current.push(available[idx].slice());save();render();
  };
  window.removeWorldCityV74=function(name){
    const current=v74Cities();
    if(current.length<=1){alert('Debe quedar al menos una ciudad.');return;}
    const idx=current.findIndex(x=>x&&x[0]===name);
    if(idx<0)return;
    current.splice(idx,1);save();render();
  };
  window.updateWorldClockV74=function(){

    const now=new Date();
    box.innerHTML=v74Cities().map(([n,z])=>`<div class="worldCity"><div class="wcName">${esc(n)}</div><div class="wcTime">${new Intl.DateTimeFormat('es-ES',{timeZone:z,hour:'2-digit',minute:'2-digit',hour12:false}).format(now)}</div><div class="small">${new Intl.DateTimeFormat('es-ES',{timeZone:z,weekday:'short',day:'numeric',month:'short'}).format(now)}</div><button type="button" class="btn secondary wcRemove" title="Quitar ciudad" onclick='removeWorldCityV74(${JSON.stringify(n)})'>✕ Quitar</button></div>`).join('');
  };

        const h=ch.querySelector?.('h3');
        if(h && norm2(h.textContent)==='🏔️ montanas, mares y oceanos'.replace('🏔️ ','')){
          /* no-op: comparación de texto abajo */
        }
      });
      [...grid.children].forEach(ch=>{
        const h=ch.querySelector?.('h3');
        if(h && norm2(h.textContent).includes('montanas, mares y oceanos')) ch.remove();
      });
      block=document.createElement('div');
      block.className='card geoCard';
      block.id='geoRelief';
      block.innerHTML='<h3 class="geoBlockTitle">🏔️ Montañas, mares y océanos</h3><div id="geoReliefQuestion" class="geoQuestion"></div><div id="geoReliefOptions" class="geoOptions v79-relief-options"></div><div class="geoResult"></div>';
      grid.appendChild(block);
    }
    return true;
  }

  function renderRelief(){
    if(!ensureReliefBlock())return;
    /* La pregunta decide el tipo y las opciones se generan exclusivamente del mismo grupo. */
    answerBlock(Math.random()<0.5?MOUNTAINS:SEAS);
  }
  window.geoRelief=renderRelief;

  function removeNotesPhrase(){
    const page=document.querySelector('#page');
    if(!page)return;
    const target='';
    const walker=document.createTreeWalker(page,NodeFilter.SHOW_TEXT);
    const nodes=[];
    let n;
    while(n=walker.nextNode()) nodes.push(n);
    nodes.forEach(t=>{
      if(t.nodeValue && norm2(t.nodeValue).includes(norm2(target))) {
        t.nodeValue=t.nodeValue.replace(/\.?/gi,'').trim();
      }
    });
  }

  function forceMetricColors(){
    const root=document.querySelector('.unitBtns');
    if(!root)return;
    const colors=[['#1976d2','#fff'],['#d32f2f','#fff'],['#fbc02d','#111']];
    ['#uLen','#uMass','#uVol'].forEach((sel,i)=>{
      const b=root.querySelector(sel);
      if(!b)return;
      b.style.setProperty('background-color',colors[i][0],'important');
      b.style.setProperty('color',colors[i][1],'important');
      b.style.setProperty('font-weight','700','important');
      b.style.setProperty('border-color',colors[i][0],'important');
    });
  }

  const oldRender79=window.render;
  window.render=function(){
    oldRender79();
    setTimeout(()=>{
      if(S.section==='supergeo')renderRelief();
      if(S.section==='grades')removeNotesPhrase();
      if(S.section==='varios')forceMetricColors();
    },0);
    setTimeout(()=>{
      if(S.section==='supergeo')renderRelief();
      if(S.section==='grades')removeNotesPhrase();
      if(S.section==='varios')forceMetricColors();
    },80);
  };

  /* Si el conversor se reconstruye al cambiar de tipo, los colores se reaplican. */
  const observer=new MutationObserver(()=>{
    if(S.section==='varios')forceMetricColors();
  });
  observer.observe(document.body,{childList:true,subtree:true});

  window.addEventListener('DOMContentLoaded',()=>{
    setTimeout(()=>{
      if(S.section==='supergeo')renderRelief();
      if(S.section==='grades')removeNotesPhrase();
      if(S.section==='varios')forceMetricColors();
    },50);
  });
})();
</script>

<script>

(function(){

  function resizeAndClearCanvas(){
    const c=el('#canvas'); if(!c)return;
    const ctx=c.getContext('2d');
    const d=window.devicePixelRatio||1;
    c.width=Math.max(1,Math.floor(c.clientWidth*d)); c.height=Math.max(1,Math.floor(c.clientHeight*d));
    ctx.setTransform(d,0,0,d,0,0); ctx.clearRect(0,0,c.clientWidth,c.clientHeight);
  }
  function loadImageIntoCanvas(data,done){
    const c=el('#canvas'); if(!c||!data)return;
    const img=new Image(); img.onload=function(){
      const ctx=c.getContext('2d'),d=window.devicePixelRatio||1;
      const cw=c.clientWidth,ch=c.clientHeight;
      ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,cw,ch);
      const scale=Math.min(cw/img.width,ch/img.height,1),w=img.width*scale,h=img.height*scale;
      ctx.drawImage(img,(cw-w)/2,(ch-h)/2,w,h); if(done)done();

  }
  function diagram(type){
    const c=el('#canvas');if(!c)return;const ctx=c.getContext('2d'),d=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;ctx.setTransform(d,0,0,d,0,0);ctx.strokeStyle=el('#drawColor')?.value||'#111';ctx.fillStyle='#fff';ctx.lineWidth=2;ctx.font='16px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    const box=(x,y,bw,bh,t)=>{ctx.strokeRect(x,y,bw,bh);ctx.fillText(t,x+bw/2,y+bh/2)};
    if(type==='flow'){box(40,30,w-80,48,'INICIO');box(40,h-78,w-80,48,'FIN');ctx.beginPath();ctx.moveTo(w/2,78);ctx.lineTo(w/2,h-78);ctx.stroke();}
    if(type==='mind'){ctx.beginPath();ctx.arc(w/2,h/2,55,0,Math.PI*2);ctx.stroke();ctx.fillText('IDEA',w/2,h/2);[['ARRIBA',w/2,45],['DERECHA',w-70,h/2],['ABAJO',w/2,h-35],['IZQUIERDA',70,h/2]].forEach(a=>{box(a[1]-45,a[2]-20,90,40,a[0]);ctx.beginPath();ctx.moveTo(w/2,h/2);ctx.lineTo(a[1],a[2]);ctx.stroke()})}
    if(type==='cycle'){const pts=[[w/2,45],[w-90,h/2],[w/2,h-45],[90,h/2]];pts.forEach((p,i)=>{ctx.beginPath();ctx.arc(p[0],p[1],35,0,Math.PI*2);ctx.stroke();ctx.fillText('PASO '+(i+1),p[0],p[1]);});for(let i=0;i<4;i++){const a=pts[i],b=pts[(i+1)%4];ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}}
    if(type==='venn'){ctx.beginPath();ctx.arc(w/2-45,h/2,70,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(w/2+45,h/2,70,0,Math.PI*2);ctx.stroke();ctx.fillText('A',w/2-80,h/2);ctx.fillText('A + B',w/2,h/2);ctx.fillText('B',w/2+80,h/2)}
  }
  function importImageFile(file){if(!file)return;const rd=new FileReader();rd.onload=()=>loadImageIntoCanvas(rd.result);rd.readAsDataURL(file)}
  function importImageUrl(){const url=(el('#drawImageUrl81')?.value||'').trim();if(!url)return;const img=new Image();img.crossOrigin='anonymous';img.onload=()=>{const c=el('#canvas');if(!c)return;const ctx=c.getContext('2d'),d=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight,s=Math.min(w/img.width,h/img.height,1),iw=img.width*s,ih=img.height*s;ctx.setTransform(d,0,0,d,0,0);ctx.drawImage(img,(w-iw)/2,(h-ih)/2,iw,ih)};img.onerror=()=>alert('No se pudo cargar esa imagen. Si procede de Pixabay, usa el enlace directo de la imagen o descárgala y utiliza "Cargar imagen".');img.src=url}

  window.addDrawingDiagram81=diagram;

  const baseDraw81=window.draw;
  window.draw=function(){
    let h=baseDraw81();
    const tools=`<div class="drawPanel81"><b>🧰 Herramientas creativas</b><div class="drawTools81">

      <button type="button" class="btn secondary" onclick="addDrawingDiagram81('cycle')">Ciclo</button>

(function(){
  function normalizeGrades93(){
    if(!S.grades || typeof S.grades!=='object') S.grades={};
    Object.keys(S.grades).forEach(function(subject){
      let arr=Array.isArray(S.grades[subject])?S.grades[subject]:[];
      arr=arr.map(function(v){
        let n=Number(typeof v==='object' ? (v.value ?? v.nota ?? v.grade) : v);
        if(!Number.isFinite(n)) return null;
        /* Las notas siempre son de 0 a 10. Corrige valores antiguos escalados
           como 80 u 800 hasta su valor real. */
        while(n>10) n=n/10;
        if(n<0) n=0;
        if(n>10) n=10;
        return Number(n.toFixed(2));
      }).filter(function(v){return v!==null;});
      S.grades[subject]=arr;
    });
    save();
    return S.grades;

<script>
/* ===== v98: NOTAS - implementación única y definitiva ===== */
(function(){
  function parseGrade(v){
    if(v && typeof v==='object') v=v.value ?? v.nota ?? v.grade;
    let s=String(v==null?'':v).trim().replace(',', '.');
    if(!s) return null;
    let n=Number(s);
    if(!Number.isFinite(n)) return null;
    // Compatibilidad con datos antiguos guardados incorrectamente: 800 -> 8,00.
    if(n>10){
      if(n>=100 && n<=1000) n=n/100;
      else if(n>10 && n<100) n=n/10;
    }
    if(n<0 || n>10) return null;
    return Math.round(n*100)/100;
  }
  function fmt(n){ return Number(n).toFixed(2).replace('.',','); }
  function normalize(){
    if(!S.grades || typeof S.grades!=='object' || Array.isArray(S.grades)) S.grades={};
    let changed=false;
    Object.keys(S.grades).forEach(function(subject){
      let old=Array.isArray(S.grades[subject])?S.grades[subject]:[];
      let arr=old.map(parseGrade).filter(function(x){return x!==null;});
      if(JSON.stringify(arr)!==JSON.stringify(old)) changed=true;
      S.grades[subject]=arr;
    });
    if(changed) save();
  }
  function drawNotes(){
    if(S.section!=='grades') return;
    normalize();
    const page=el('#page'); if(!page) return;
    page.innerHTML='';
    const title=document.createElement('h1'); title.textContent='Notas'; page.appendChild(title);

    const addSubject=document.createElement('button');
    addSubject.type='button'; addSubject.className='btn notesGreenButton'; addSubject.textContent='➕ Añadir asignatura';
    addSubject.onclick=function(){
      const name=(prompt('Nombre de la asignatura:','')||'').trim();
      if(!name) return;
      if(Object.prototype.hasOwnProperty.call(S.grades,name)){ alert('Esa asignatura ya existe.'); return; }
      S.grades[name]=[]; save(); drawNotes();
    };
    const top=document.createElement('div'); top.className='card'; top.appendChild(addSubject); page.appendChild(top);

    const subjects=Object.keys(S.grades);
    const all=[]; subjects.forEach(function(s){ all.push(...S.grades[s]); });
    const total=all.length ? all.reduce((a,b)=>a+b,0)/all.length : 0;
    const totalCard=document.createElement('div'); totalCard.className='gradesTop';
    totalCard.innerHTML='<div class="card" style="text-align:center"><div class="small">MEDIA TOTAL</div><div class="avg">'+fmt(total)+'</div></div>';
    page.appendChild(totalCard);

    const grid=document.createElement('div'); grid.className='grid'; grid.style.marginTop='16px'; page.appendChild(grid);
    if(!subjects.length){
      const empty=document.createElement('div'); empty.className='card'; empty.textContent='Todavía no hay asignaturas.'; grid.appendChild(empty); return;
    }

    subjects.forEach(function(subject){
      const arr=S.grades[subject];
      const card=document.createElement('div'); card.className='card subject';
      const h=document.createElement('h3'); h.textContent=subject; card.appendChild(h);
      const lab=document.createElement('div'); lab.className='small'; lab.textContent='Media de la asignatura'; card.appendChild(lab);
      const avg=document.createElement('div'); avg.style.cssText='font-size:24px;font-weight:900'; card.appendChild(avg);
      const list=document.createElement('div'); list.style.marginTop='12px'; card.appendChild(list);

      function updateAverage(){
        const nums=arr.map(parseGrade).filter(x=>x!==null);
        const a=nums.length?nums.reduce((x,y)=>x+y,0)/nums.length:0;
        avg.textContent=fmt(a);
      }

      arr.forEach(function(note,index){
        const row=document.createElement('div');
        row.style.cssText='display:flex;align-items:center;gap:7px;margin:8px 0;flex-wrap:wrap';
        const input=document.createElement('input');
        input.type='text'; input.inputMode='decimal'; input.className='field'; input.value=fmt(note);
        input.style.cssText='width:90px;font-weight:700;text-align:center';
        const edit=document.createElement('button'); edit.type='button'; edit.className='btn secondary'; edit.textContent='✏️ Modificar';
        edit.style.cssText='font-size:11px;padding:5px 8px';
        const del=document.createElement('button'); del.type='button'; del.className='btn danger'; del.textContent='🗑️ Eliminar';
        del.style.cssText='font-size:11px;padding:5px 8px';
        function modify(){
          const n=parseGrade(input.value);
          if(n===null){ alert('Introduce una nota válida entre 0,00 y 10,00.'); input.value=fmt(arr[index]); return; }
          arr[index]=n; S.grades[subject]=arr; save(); drawNotes();
        }
        edit.onclick=modify;
        input.addEventListener('change',modify);
        del.onclick=function(){
          if(!confirm('¿Eliminar esta nota?')) return;
          arr.splice(index,1); S.grades[subject]=arr; save(); drawNotes();
        };
        row.appendChild(input); row.appendChild(edit); row.appendChild(del); list.appendChild(row);
      });

      const add=document.createElement('button'); add.type='button'; add.className='btn notesGreenButton'; add.textContent='➕ Añadir nota'; add.style.marginTop='8px';
      add.onclick=function(){
        const raw=prompt('Nueva nota (ejemplo: 7,25):','7,00'); if(raw===null)return;
        const n=parseGrade(raw); if(n===null){alert('Introduce una nota válida entre 0,00 y 10,00.');return;}
        arr.push(n); S.grades[subject]=arr; save(); drawNotes();
      };
      card.appendChild(add); updateAverage(); grid.appendChild(card);
    });
  }

  window.grades=drawNotes;
  const previousRender=window.render;
  window.render=function(){
    // Para Notas NO se ejecutan los renderizadores antiguos: así ninguno puede sobrescribir esta versión.
    if(S.section==='grades'){ drawNotes(); return; }
    previousRender();
  };
  if(S.section==='grades') drawNotes();
})();
</script>

<script>

(function(){
  let savedRange107=null;
  let selectedEmoji107=null;
  const sizes107=[16,20,24,28,32,36,40,48,56,64,72,84,96,120];

  function textEl107(node){
    if(!node)return null;
    const e=node.nodeType===3?node.parentElement:node;
    return e?.closest?.('.lnTextItem103')||null;
  }
  function rememberRange107(){
    const sel=window.getSelection?.();
    if(!sel||!sel.rangeCount)return;
    const r=sel.getRangeAt(0), t=textEl107(r.commonAncestorContainer);
    if(t)savedRange107=r.cloneRange();
  }
  document.addEventListener('selectionchange',rememberRange107,true);

  function selectEmoji107(span){
    selectedEmoji107=span;
    const r=document.createRange();r.selectNode(span);
    const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);
    savedRange107=r.cloneRange();
    const size=document.getElementById('v107EmojiSize');
    if(size)size.value=String(parseInt(span.style.fontSize,10)||40);
    const info=document.getElementById('v107EmojiSizeInfo');
    if(info)info.textContent=(parseInt(span.style.fontSize,10)||40)+' px';
  }

  function insertEmoji107(emoji){
    let target=null;
    if(savedRange107)target=textEl107(savedRange107.commonAncestorContainer);
    if(!target)target=document.activeElement?.closest?.('.lnTextItem103')||null;
    if(!target){alert('Primero coloca el cursor dentro de un texto del dibujo.');return}
    target.focus();
    const r=savedRange107?.cloneRange();
    if(!r||!textEl107(r.commonAncestorContainer)){
      const rr=document.createRange();rr.selectNodeContents(target);rr.collapse(false);savedRange107=rr;r=rr;
    }
    const span=document.createElement('span');
    span.className='lnEmoji107';span.textContent=emoji;span.style.fontSize='40px';span.style.fontFamily='sans-serif';
    span.title='Pulsa para seleccionar y cambiar el tamaño';
    span.addEventListener('mousedown',e=>e.preventDefault());
    span.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();selectEmoji107(span)});
    r.deleteContents();r.insertNode(span);
    const after=document.createRange();after.setStartAfter(span);after.collapse(true);
    const sel=window.getSelection();sel.removeAllRanges();sel.addRange(after);savedRange107=after.cloneRange();selectedEmoji107=span;
    const size=document.getElementById('v107EmojiSize');if(size)size.value='40';
    const info=document.getElementById('v107EmojiSizeInfo');if(info)info.textContent='40 px';
    target.dispatchEvent(new InputEvent('input',{bubbles:true,inputType:'insertText',data:emoji}));
  }

  function setEmojiSize107(value){
    const n=parseInt(value,10);if(!n||!selectedEmoji107)return;
    selectedEmoji107.style.fontSize=n+'px';
    const info=document.getElementById('v107EmojiSizeInfo');if(info)info.textContent=n+' px';
    const target=textEl107(selectedEmoji107);if(target)target.dispatchEvent(new Event('input',{bubbles:true}));
  }
  window.insertEmojiAtTextCursor107=insertEmoji107;
  window.setEmojiSize107=setEmojiSize107;

  function rebuild107(){
    if(S.section!=='draw')return;
    const details=[...document.querySelectorAll('details')].find(d=>/Emoticonos/i.test(d.querySelector('summary')?.textContent||''));
    if(!details)return;
    const old=details.querySelector('.v106-emoji-grid,.v105-emoji-grid,.lnEmojiGrid104');
    if(!old)return;
    old.className='v107-emoji-grid';
    const oldBtns=[...old.querySelectorAll('button')];
    old.innerHTML='';
    const emojis=oldBtns.map(b=>b.textContent).filter(Boolean);
    const sizebar=document.createElement('div');
    sizebar.className='v107-emoji-sizebar';
    sizebar.innerHTML='<span class="small">Tamaño del emoticono:</span><select id="v107EmojiSize" class="field">'+sizes107.map(n=>`<option value="${n}"${n===40?' selected':''}>${n} px</option>`).join('')+'</select><span id="v107EmojiSizeInfo" class="small">40 px</span><span class="small">Selecciona un emoticono insertado y cambia aquí su tamaño.</span>';
    details.insertBefore(sizebar,old);
    document.getElementById('v107EmojiSize').addEventListener('change',e=>setEmojiSize107(e.target.value));
    emojis.forEach(e=>{
      const b=document.createElement('button');b.type='button';b.className='btn secondary v107-emoji-btn';b.textContent=e;b.title='Insertar emoticono en el cursor';
      b.addEventListener('mousedown',ev=>ev.preventDefault());
      b.addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();insertEmoji107(e)});
      old.appendChild(b);
    });
  }
  const oldRender107=window.render;
  window.render=function(){oldRender107();if(S.section==='draw')setTimeout(rebuild107,45)};
  if(S.section==='draw')setTimeout(rebuild107,80);
})();
</script>

<script>
/* ===== Litternotes v112: Cálculos matemáticos - nivel 1.º ESO ===== */
(function(){
  function sh112(a){return a.slice().sort(function(){return Math.random()-.5;});}
  function r112(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
  function fmt112(n){
    if(Math.abs(n-Math.round(n))<1e-10)return String(Math.round(n));
    return String(Number(n.toFixed(2))).replace('.',',');
  }
  function gcd112(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a||1;}
  function frac112(n,d){
    if(d<0){n=-n;d=-d;}
    const g=gcd112(n,d); return [n/g,d/g];
  }
  function fracText112(n,d){
    const f=frac112(n,d); return f[1]===1?String(f[0]):f[0]+'/'+f[1];
  }
  function makeMath112(){
    const type=r112(1,10);
    let q='',ans='',opts=[];
    if(type===1){
      const a=r112(-15,15),b=r112(-15,15); ans=fmt112(a+b); q=`Calcula: ${a} + (${b})`; steps=`${a} + (${b}) = ${ans}`;
      opts=[ans,fmt112(a-b),fmt112(Math.abs(a)+Math.abs(b)),fmt112(-(a+b))];
    } else if(type===2){
      const a=r112(-15,15),b=r112(-15,15); ans=fmt112(a-b); q=`Calcula: ${a} − (${b})`; steps=`${a} − (${b}) = ${ans}`;
      opts=[ans,fmt112(a+b),fmt112(b-a),fmt112(Math.abs(a-b))];
    } else if(type===3){
      const a=r112(-9,9)||3,b=r112(-9,9)||-2; ans=fmt112(a*b); q=`Calcula: ${a} × (${b})`; steps=`${a} × (${b}) = ${ans}`;
      opts=[ans,fmt112(a+b),fmt112(a-b),fmt112(a*b*-1)];
    } else if(type===4){
      const b=r112(2,9),a=r112(-9,9)*b; ans=fmt112(a/b); q=`Calcula: ${a} ÷ ${b}`; steps=`${a} ÷ ${b} = ${ans}`;
      opts=[ans,fmt112(a*b),fmt112(a-b),fmt112(b/a)];
    } else if(type===5){
      const a=r112(2,6),b=r112(2,5),c=r112(1,9); ans=fmt112(a+b*c); q=`Calcula: ${a} + ${b} × ${c}`; steps=`Primero ${b} × ${c} = ${b*c}; después ${a} + ${b*c} = ${ans}`;
      opts=[ans,fmt112((a+b)*c),fmt112(a+b+c),fmt112(a*b+c)];
    } else if(type===6){
      const a=r112(2,5),b=r112(2,4); ans=fmt112(Math.pow(a,b)); q=`Calcula: ${a}<sup>${b}</sup>`; steps=`${a}<sup>${b}</sup> = ${Array(b).fill(a).join(' × ')} = ${ans}`;
      opts=[ans,fmt112(a*b),fmt112(a+b),fmt112(Math.pow(b,a))];
    } else if(type===7){
      const d1=r112(2,8),n1=r112(1,d1-1),d2=r112(2,8),n2=r112(1,d2-1); const n=n1*d2+n2*d1,d=d1*d2; ans=fracText112(n,d);
      q=`Calcula: ${n1}/${d1} + ${n2}/${d2}`; steps=`Denominador común: ${d1} × ${d2} = ${d}. Numeradores: ${n1} × ${d2} + ${n2} × ${d1} = ${n}. Simplificamos: ${ans}`;
      opts=[ans,fracText112(n1*d2-n2*d1,d),fracText112(n1*n2,d),fracText112(n,d+1)];
    } else if(type===8){
      const d1=r112(2,8),n1=r112(1,d1-1),d2=r112(2,8),n2=r112(1,d2-1); const n=n1*d2-n2*d1,d=d1*d2; ans=fracText112(n,d);
      q=`Calcula: ${n1}/${d1} − ${n2}/${d2}`; steps=`Denominador común: ${d1} × ${d2} = ${d}. Numeradores: ${n1} × ${d2} − ${n2} × ${d1} = ${n}. Simplificamos: ${ans}`;
      opts=[ans,fracText112(n1*d2+n2*d1,d),fracText112(n1*n2,d),fracText112(n,d+1)];
    } else if(type===9){
      const x=r112(2,15),a=r112(1,9); ans=fmt112(x); q=`Resuelve: x + ${a} = ${x+a}`; steps=`Restamos ${a} a ambos lados: x = ${x+a} − ${a} = ${ans}`;
      opts=[ans,fmt112(x+a),fmt112(x-a),fmt112(a)];
    } else {
      const p=r112(10,90),base=r112(20,200); ans=fmt112(base*p/100); q=`¿Cuánto es el ${p}% de ${base}?`; steps=`${p}% de ${base} = ${base} × ${p} ÷ 100 = ${ans}`;
      opts=[ans,fmt112(base*(100-p)/100),fmt112(base+p),fmt112(p*base/10)];
    }
    // Garantiza opciones numéricamente distintas y exactamente una correcta.
    opts=[...new Set(opts.map(String))];
    while(opts.length<4){
      const v=ans+'_'+r112(1,99); opts.push(v);
    }
    opts=sh112(opts.slice(0,4));
    return {q,ans,opts,steps};
  }
  function mathQuestion112(){
    const q=el('#geoMathQuestion112'),o=el('#geoMathOptions112'),res=el('#geoMathResult112');
    if(!q||!o)return;
    const item=makeMath112();
    q.innerHTML=item.q;
    if(res)res.textContent='';
    o.innerHTML=item.opts.map(function(x){return '<button type="button" class="btn secondary math112-answer">'+esc(x)+'</button>';}).join('');
    o.querySelectorAll('.math112-answer').forEach(function(b){

  }
  const baseSuper112=window.supergeo;
  // Inserción segura del nuevo bloque justo antes del cierre de geoGrid.
  window.supergeo=function(){
    let h=baseSuper112();
    const math=card('<div class="geoCard geoMath112" id="geoMath112"><h3 class="geoBlockTitle">🧮 Cálculos matemáticos · 1.º ESO</h3><p class="small"></p><div id="geoMathQuestion112" class="math112-question"></div><div id="geoMathOptions112" class="math112-options"></div><div id="geoMathResult112" class="math112-result"></div><button type="button" class="btn" id="geoMathNew112">🔄 Nuevo cálculo</button></div>');
    const close=h.lastIndexOf('</div>');
    return close>=0 ? h.slice(0,close)+math+h.slice(close) : h+math;
  };
  function renderMathSuper112(){
    if(typeof S==='undefined'||S.section!=='supergeo')return;
    const page=el('#page');if(!page)return;
    page.innerHTML=window.supergeo();
    try{bind();}catch(e){}
    try{geoCapital();}catch(e){}
    try{geoCCAA();}catch(e){}
    try{geoRiver();}catch(e){}
    try{geoBody();}catch(e){}
    try{geoChem();}catch(e){}
    try{geoHistory();}catch(e){}
    try{geoInstrument();}catch(e){}
    try{if(typeof relief92==='function')relief92();}catch(e){}
    const rn=el('#geoReliefNew92');if(rn&&typeof relief92==='function')rn.onclick=relief92;
    mathQuestion112();
    const mn=el('#geoMathNew112');if(mn)mn.onclick=mathQuestion112;
  }
  const oldRender112=window.render;
  window.render=function(){
    if(S.section==='supergeo'){renderMathSuper112();return;}
    oldRender112();
  };
  window.renderMathSuper112=renderMathSuper112;
  if(S.section==='supergeo')setTimeout(renderMathSuper112,0);
})();
</script>

<script>
(function(){
  const terms114=[
    ['RAM','Memoria temporal que utiliza el ordenador para trabajar con los programas abiertos.'],
    ['USB','Conexión y estándar utilizado para conectar dispositivos y transferir datos.'],
    ['GB','Gigabyte, unidad de capacidad de almacenamiento o memoria. 1 GB equivale aproximadamente a 1.000 MB.'],

    ['Monitor','Pantalla que muestra imágenes, texto y vídeo procedentes del ordenador.'],
    ['Disco SSD','Unidad de almacenamiento rápida que utiliza memoria flash y no tiene piezas mecánicas móviles.'],

    ['Archivo','Conjunto de datos guardados con un nombre, por ejemplo una foto, un documento o un vídeo.'],
    ['Carpeta','Lugar donde se organizan y almacenan archivos y otras carpetas.'],
    ['Wi-Fi','Tecnología que permite conectar dispositivos a una red mediante ondas de radio, sin cable.'],
    ['Bluetooth','Tecnología inalámbrica de corto alcance para conectar dispositivos.'],
    ['Navegador web','Programa utilizado para acceder y consultar páginas y servicios de Internet.'],
    ['Internet','Red mundial que conecta redes y dispositivos para intercambiar información y ofrecer servicios.']
  ];
  const esc114=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function block114(){
    let current=null;
    function newQ(){
      const item=terms114[Math.floor(Math.random()*terms114.length)];
      const others=terms114.filter(x=>x[0]!==item[0]).sort(()=>Math.random()-.5).slice(0,3).map(x=>x[0]);
      const opts=[item[0],...others].sort(()=>Math.random()-.5);
      current=item;

      root.innerHTML='<div class="lnInfoQuestion114"><b>¿Qué término informático corresponde a esta descripción?</b><div class="lnInfoDefinition114">'+esc114(item[1])+'</div></div><div class="lnInfoOpts114">'+opts.map((o,i)=>'<button type="button" class="btn lnInfoOpt114" data-i="'+i+'">'+esc114(o)+'</button>').join('')+'</div><div id="lnInfoResult114" class="lnInfoResult114"></div>';
      root.querySelectorAll('.lnInfoOpt114').forEach(b=>b.addEventListener('click',()=>{

        root.querySelectorAll('.lnInfoOpt114').forEach(x=>x.disabled=true);

      }));
    }
    return '<section class="card lnInfoBlock114"><h2>💻 Términos informáticos</h2><p>Conceptos básicos de informática adecuados para 1.º ESO.</p><div id="lnInfoTerms114"></div><button type="button" class="btn" id="lnInfoNew114">🔄 Nuevo término</button></section>';
  }
  const oldRender114=window.render;
  window.render=function(){
    const r=oldRender114.apply(this,arguments);
    setTimeout(()=>{
      try{

<script id="v183-image-background-fix">
(function(){
  'use strict';
  const DB='minotes-background-images-v183', STORE='images', KEY='main';
  function openDB(){return new Promise(function(resolve,reject){
    if(!window.indexedDB){reject(new Error('IndexedDB no disponible'));return;}
    const req=indexedDB.open(DB,1);
    req.onupgradeneeded=function(){if(!req.result.objectStoreNames.contains(STORE))req.result.createObjectStore(STORE);};
    req.onsuccess=function(){resolve(req.result)}; req.onerror=function(){reject(req.error||new Error('No se pudo abrir el almacenamiento'))};
  });}
  async function putImage(data){const db=await openDB();return new Promise(function(resolve,reject){const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(data,KEY);tx.oncomplete=function(){db.close();resolve()};tx.onerror=function(){db.close();reject(tx.error)}})}
  async function getImage(){const db=await openDB();return new Promise(function(resolve,reject){const tx=db.transaction(STORE,'readonly');const q=tx.objectStore(STORE).get(KEY);q.onsuccess=function(){db.close();resolve(q.result||'')};q.onerror=function(){db.close();reject(q.error)}})}
  async function delImage(){try{const db=await openDB();await new Promise(function(resolve,reject){const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(KEY);tx.oncomplete=resolve;tx.onerror=function(){reject(tx.error)}});db.close()}catch(e){}}
  function setImageBackground(data){
    if(!data)return;
    document.body.classList.add('minotes-v183-custom-image');
    document.body.style.backgroundImage='url("'+data.replace(/"/g,'%22')+'")';
    document.body.style.backgroundSize='cover';
    document.body.style.backgroundPosition='center center';
    document.body.style.backgroundRepeat='no-repeat';
    document.body.style.backgroundAttachment='fixed';
  }
  async function restoreImage(){
    try{
      const st=S.globalBackground173||{};
      if(st.type==='image'){
        const data=await getImage();
        if(data)setImageBackground(data);
      }
    }catch(e){}
  }
  const oldApply=window.applyBackground183;
  window.applyBackground183=restoreImage;

  window.loadBackgroundImage173=async function(input){
    const f=input&&input.files&&input.files[0];
    if(!f)return;
    if(!f.type||!f.type.startsWith('image/')){alert('Selecciona una imagen válida.');input.value='';return;}
    try{
      const data=await new Promise(function(resolve,reject){
        const reader=new FileReader();
        reader.onload=function(){resolve(reader.result)};
        reader.onerror=function(){reject(new Error('No se pudo leer la imagen'))};
        reader.readAsDataURL(f);
      });
      const img=await new Promise(function(resolve,reject){
        const im=new Image();im.onload=function(){resolve(im)};im.onerror=function(){reject(new Error('No se pudo decodificar la imagen'))};im.src=data;
      });
      const max=1800;
      const scale=Math.min(1,max/img.width,max/img.height);
      const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const ctx=c.getContext('2d',{alpha:false});ctx.fillStyle='#ffffff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
      let quality=.82,compressed=c.toDataURL('image/jpeg',quality);
      /* Si es grande, reducimos progresivamente para que IndexedDB almacene sin problemas. */
      while(compressed.length>1800000 && quality>.45){quality-=.08;compressed=c.toDataURL('image/jpeg',quality)}
      await putImage(compressed);
      S.globalBackground173={type:'image',value:'',name:f.name||'Imagen personalizada'};
      /* No guardamos los megabytes de la imagen en localStorage: solo el estado. */
      try{save()}catch(e){}
      document.body.classList.remove(...Object.values(window.__minotesTextureClasses||{}));
      document.body.classList.add('minotes-v183-custom-image');
      setImageBackground(compressed);
      if(typeof render==='function')render();
      setTimeout(function(){setImageBackground(compressed)},0);
    }catch(e){
      alert('No se ha podido cargar la imagen. Prueba con JPG, PNG o WEBP.');
    }finally{input.value='';}
  };

  const oldReset=window.resetBackground173;
  window.resetBackground173=function(){
    delImage();
    document.body.classList.remove('minotes-v183-custom-image');
    if(oldReset)oldReset();
  };

  /* El fondo personalizado se restaura al abrir la aplicación y después de cada renderizado. */
  const oldRender=window.render;
  window.render=function(){
    const r=oldRender.apply(this,arguments);
    setTimeout(restoreImage,0);
    return r;
  };
  setTimeout(restoreImage,50);
})();
</script>
