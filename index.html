function drawPreview(x,a,b){x.strokeStyle=el('#drawColor').value;x.lineWidth=+el('#drawSize').value;x.lineCap='round';x.lineJoin='round';x.beginPath();let x0=a.x,y0=a.y,x1=b.x,y1=b.y,w=x1-x0,h=y1-y0,cx=(x0+x1)/2,cy=(y0+y1)/2,rx=Math.abs(w)/2,ry=Math.abs(h)/2;if(tool==='line'){x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);if(lineType==='arrow'){let ang=Math.atan2(h,w),len=14;x.moveTo(b.x,b.y);x.lineTo(b.x-Math.cos(ang-.45)*len,b.y-Math.sin(ang-.45)*len);x.moveTo(b.x,b.y);x.lineTo(b.x-Math.cos(ang+.45)*len,b.y-Math.sin(ang+.45)*len)}}else if(shapeType==='circle'){x.ellipse(cx,cy,rx,ry,0,0,Math.PI*2)}else if(shapeType==='rectangle'){x.rect(Math.min(x0,x1),Math.min(y0,y1),Math.abs(w),Math.abs(h))}else if(shapeType==='square'){let side=Math.max(Math.abs(w),Math.abs(h));x.rect(x0,y0,side*(w<0?-1:1),side*(h<0?-1:1))}else if(['triangle','rhombus','pentagon','hexagon'].includes(shapeType)){let n={triangle:3,rhombus:4,pentagon:5,hexagon:6}[shapeType],rrx=rx,rry=ry;for(let i=0;i<n;i++){let ang=-Math.PI/2+i*2*Math.PI/n,px=cx+rrx*Math.cos(ang),py=cy+rry*Math.sin(ang);i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath()}else if(shapeType==='spiral'){for(let t=0;t<=Math.PI*5;t+=.08){let r=(t/(Math.PI*5))*Math.min(rx,ry),px=cx+r*Math.cos(t),py=cy+r*Math.sin(t);t===0?x.moveTo(px,py):x.lineTo(px,py)}}else if(shapeType==='star'){for(let i=0;i<10;i++){let r=i%2?Math.min(rx,ry)*.42:Math.min(rx,ry),ang=-Math.PI/2+i*Math.PI/5,px=cx+r*Math.cos(ang),py=cy+r*Math.sin(ang);i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath()}else if(shapeType==='flower'||shapeType==='petals'){let petals=shapeType==='flower'?5:8;for(let i=0;i<=petals*20;i++){let t=i*Math.PI*2/(petals*20),r=Math.min(rx,ry)*(.55+.28*Math.sin(petals*t)),px=cx+rx*(r/Math.min(rx,ry))*Math.cos(t),py=cy+ry*(r/Math.min(rx,ry))*Math.sin(t);i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath()}else if(shapeType==='heart'){x.moveTo(cx,cy+ry*.75);for(let t=0;t<=Math.PI*2;t+=.06){let px=cx+rx*.9*Math.pow(Math.sin(t),3),py=cy-ry*(.55*Math.cos(t)-.28*Math.cos(2*t)-.1 function fillAt(px,py){let c=el('#canvas'),ctx=c.getContext('2d',{willReadFrequently:true}),img=ctx.getImageData(0,0,c.width,c.height),d=img.data,w=c.width,h=c.height;if(px<0||py<0||px>=w||py>=h)return;let i=(py*w+px)*4,target=[d[i],d[i+1],d[i+2],d[i+3]],col=hexRgb(el('#drawColor').value);let transparent=target[3]===0;let tol=45;let same=j=>{if(transparent)return d[j+3]===0;return d[j+3]>0&&Math.abs(d[j]-target[0])+Math.abs(d[j+1]-target[1])+Math.abs(d[j+2]-target[2])+Math.abs(d[j+3]-target[3])<=tol};let q=[[px,py]],seen=new Uint8Array(w*h);while(q.length){let [cx,cy]=q.pop();if(cx<0||cy<0||cx>=w||cy>=h)continue;let k=cy*w+cx,j=k*4;if(seen[k])continue;seen[k]=1;if(!same(j))continue;d[j]=col[0];d[j+1]=col[1];d[j+2]=col[2];d[j+3]=255;q.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1])}ctx.putImageData(img,0,0)}function hexRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}function clearCanvas(){let c=el('#canvas');if(c)c.getContext('2d').clearRect(0,0,c.width,c.height)}

function fmtSW(ms){let sec=Math.floor(ms/1000),h=String(Math.floor(sec/3600)).padStart(2,'0'),m=String(Math.floor(sec%3600/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');return h+':'+m+':'+s}
let swInt,swT=0,swOn=false,tmInt,tmT=300;function swStart(){if(swOn)return;swOn=true;let st=Date.now()-swT;swInt=setInterval(()=>{swT=Date.now()-st;if(el('#sw'))el('#sw').textContent=fmtSW(swT)},200)}function swPause(){swOn=false;clearInterval(swInt)}function swReset(){swPause();swT=0;if(el('#sw'))el('#sw').textContent='00:00:00'}function setM(n){tmT=n*60;updateTm()}function tmStart(){clearInterval(tmInt);tmInt=setInterval(()=>{if(tmT<=0){clearInterval(tmInt);alert('⏰ ¡Tiempo terminado!');return}tmT--;updateTm()},1000)}function tmPause(){clearInterval(tmInt)}function tmReset(){tmPause();tmT=+el('#mins').value*60||0;updateTm()}function updateTm(){if(el('#tm'))el('#tm').textContent=fmtSW(tmT*1000)}
const zoneMap={'Madrid':'Europe/Madrid','Londres':'Europe/London','Nueva York':'America/New_York','Manila':'Asia/Manila','Tokio':'Asia/Tokyo','París':'Europe/Paris','Roma':'Europe/Rome','Berlín':'Europe/Berlin','Miami':'America/New_York','Los Ángeles':'America/Los_Angeles','México':'America/Mexico_City','Sídney':'Australia/Sydney'};function renderWorldClocks(){let e=el('#worldclocks');if(!e)return;let now=new Date();e.innerHTML=S.cities.map((c,i)=>{let tz=zoneMap[c]||'UTC';let t=now.toLocaleTimeString('es-ES',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:undefined,hour12:false}).slice(0,5);let date=now.toLocaleDateString('es-ES',{timeZone:tz,day:'2-digit',month:'2-digit'});return `<div class="item"><span>🌍 <b>${esc(c)}</b><br><span class="small">${date}</span></span><span class="clock worldtime">${t}</span><button class="btn danger" onclick="removeCity(${i})">×</button></div>`}).join('')}

function music(){return `<h1>Música <span class="musicHeartInline" id="musicHeart">❤️</span></h1>${card('<h3 class="musicTitle">🎵 Música local</h3><p>Selecciona archivos de audio desde tu ordenador. Cada archivo se carga una sola vez.</p><div class="row"><button class="btn" onclick="el(\'#musicFiles\').click()">🎵 Cargar archivos</button><button class="btn secondary" onclick="musicPlayPause()">▶ / ⏸</button><button class="btn secondary" onclick="musicPrev()">⏮</button><button class="btn secondary" onclick="musicNext()">⏭</button></div><div id="tracks" class="list" style="margin-top:12px">'+(S.music.length?S.music.map((m,i)=>`<div class="item"><span class="musicTrackTitle">🎵 ${esc(m.name)}</span><div class="row"><button class="btn" onclick="playTrack(${i})">▶</button><button class="btn musicDelete" onclick="delMusic(${i})">🗑️ Eliminar</button></div></div>`).join(''):'<div class="small">No hay canciones cargadas.</div>')+'</div><div class="eqPanel"><div class="eqControl"><div>🔊 Volumen</div><div class="eqKnob"></div><input id="volumeMusic" type="range" min="0" max="1" step=".01" value=".8"></div><div class="eqControl"><div>🎚️ Graves</div><div class="eqKnob"></div><input id="bassMusic" type="range" min="-12" max="12" value="0"></div><div class="eqControl"><div>🎚️ Agudos</div><div class="eqKnob"></div><input id="trebleMusic" type="range" min="-12" max="12" value="0"></div></div><div class="small" id="song2">Sin canción</div>')}`}

function musicPrev(){if(S.music.length)playTrack((track-1+S.music.length)%S.music.length)}
function musicNext(){if(S.music.length)playTrack((track+1)%S.music.length)}
function playTrack(i){if(!S.music[i])return;track=i;const m=S.music[i];if(isIOSAudio){try{if(audioCtx){audio.pause();audio.src='';}}catch(e){} audio.src=m.url; audio.load(); const p=audio.play(); if(p&&p.catch)p.catch(e=>console.warn('Audio iPad:',e));}else{setupAudioFX();if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();audio.src=m.url;audio.load();const p=audio.play();if(p&&p.catch)p.catch(e=>console.warn('Audio:',e));}el('#musicArt')&&(el('#musicArt').textContent=['🎵','🎸','🎹','🎧','🥁'][i%5]);el('#song2')&&(el('#song2').textContent=m.name)}
function delMusic(i){if(!S.music[i])return;if(track===i){audio.pause();audio.removeAttribute('src');el('#song2')&&(el('#song2').textContent='Sin canción');}else if(track>i)track--;S.music.splice(i,1);save();render();}
function bindMusicFiles(){const input=el('#musicFiles');if(!input)return;input.onchange=e=>{const files=Array.from(e.target.files||[]);let added=0;for(const f of files){const key=f.name+'|'+f.size+'|'+f.lastModified;const exists=S.music.some(m=>(m.name+'|'+(m.size||0)+'|'+(m.lastModified||0))===key);if(!exists){S.music.push({name:f.name,size:f.size,lastModified:f.lastModified,type:f.type||'audio/mpeg',url:URL.createObjectURL(f)});added++;}}input.value='';if(added){save();render();}else if(files.length){alert('Ese archivo ya está cargado.');}}}

function bindClassImage(){let input=el('#classImg');if(!input)return;input.onchange=e=>{let file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){alert('Selecciona una imagen.');return}let reader=new FileReader();reader.onload=()=>{let src=reader.result;let img=new Image();img.onload=()=>{let max=1400,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*scale),h=Math.round(img.naturalHeight*scale),cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);S.classImage=cv.toDataURL('image/jpeg',.85);save();render()};img.src=src};reader.readAsDataURL(file)}}
let audioCtx=null,masterGain=null,bassFilter=null,trebleFilter=null,audioSource=null;
function setupAudioFX(){
  try{
    if(!audioCtx){
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      audioSource=audioCtx.createMediaElementSource(audio);
      bassFilter=audioCtx.createBiquadFilter(); bassFilter.type='lowshelf'; bassFilter.frequency.value=180;
      trebleFilter=audioCtx.createBiquadFilter(); trebleFilter.type='highshelf'; trebleFilter.frequency.value=3500;
      masterGain=audioCtx.createGain(); masterGain.gain.value=Number(el('#volumeMusic')?.value||.8);
      audioSource.connect(bassFilter).connect(trebleFilter).connect(masterGain).connect(audioCtx.destination);
    }
    if(audioCtx.state==='suspended')audioCtx.resume();
    if(el('#volumeMusic'))el('#volumeMusic').value=String(masterGain.gain.value);
    if(el('#bassMusic'))el('#bassMusic').value=String(bassFilter.gain.value);
    if(el('#trebleMusic'))el('#trebleMusic').value=String(trebleFilter.gain.value);
  }catch(e){console.warn('Audio FX no disponible',e)}
}
function setBass(v){if(!audioCtx)setupAudioFX();if(bassFilter)bassFilter.gain.value=Number(v)||0}
function setTreble(v){if(!audioCtx)setupAudioFX();if(trebleFilter)trebleFilter.gain.value=Number(v)||0}

(function(){

    const answer=q[answerIndex];

    oEl.querySelectorAll('button').forEach(b=>b.onclick=function(){
      const ok=this.textContent.trim().toLowerCase()===firstUpper(answer).toLowerCase();
      oEl.querySelectorAll('button').forEach(x=>x.disabled=true);
      this.classList.add(ok?'correct':'wrong');
      const res=oEl.parentElement.querySelector('.geoResult'); if(res)res.textContent=ok?'✅ ¡Correcto!':'❌ Incorrecto. Respuesta: '+firstUpper(answer);

  window.geoInst=function(){makeGeoBlock('geoInst','Instrumentos',q=>q[1],GEO.instruments,0)};

  // Rebind only these three blocks after Supergeografía renders; other blocks remain untouched.
  const oldSuper=window.supergeo;

  window.deleteAgendaExam=function(index){

<script>
(function(){
  // v41: reparación definitiva de los tres bloques de Supergeografía.
  function cleanText(v){return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();}
  function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  function renderStableBlock(id, rows, questionIndex, answerIndex){
    const qEl=el('#'+id+'Question'), oEl=el('#'+id+'Options');
    if(!qEl||!oEl||!Array.isArray(rows)||rows.length<4)return false;
    const row=rows[Math.floor(Math.random()*rows.length)];
    const question=String(row[questionIndex]??'');
    const answer=String(row[answerIndex]??'');
    const pool=[]; for(const r of shuffle(rows)){const v=String(r[answerIndex]??'');if(v!==answer&&!pool.includes(v))pool.push(v);if(pool.length===3)break;}
    const options=shuffle([answer,...pool]);
    qEl.textContent=question;
    oEl.innerHTML='';
    options.forEach(option=>{
      const b=document.createElement('button');b.type='button';b.className='btn secondary geoV41Answer';b.textContent=String(option).charAt(0).toUpperCase()+String(option).slice(1);
      b.addEventListener('click',function(){
        oEl.querySelectorAll('button').forEach(x=>x.disabled=true);
        const ok=cleanText(this.textContent)===cleanText(answer);
        this.classList.add(ok?'correct':'wrong');
        const result=oEl.parentElement.querySelector('.geoResult');
        if(result)result.textContent=ok?'✅ ¡Correcto!':'❌ Incorrecto. Respuesta: '+(String(answer).charAt(0).toUpperCase()+String(answer).slice(1));
      });
      oEl.appendChild(b);
    });
    return true;
  }
  function repairSupergeo(){
    // Los datos de estos tres bloques tienen estructuras diferentes: [país,gentilicio], [respuesta,pregunta,respuesta] y [respuesta,pregunta,respuesta].
    renderStableBlock('geoGent',GEO.demonyms,0,1);
    renderStableBlock('geoHist',GEO.history,1,2);
    renderStableBlock('geoInst',GEO.instruments,1,2);
  }
  window.geoGent=()=>renderStableBlock('geoGent',GEO.demonyms,0,1);
  window.geoHistory=()=>renderStableBlock('geoHist',GEO.history,1,2);
  window.geoInstrument=()=>renderStableBlock('geoInst',GEO.instruments,1,2);
  const renderBefore41=window.render;
  window.render=function(){
    renderBefore41();
    if(S.section==='supergeo')requestAnimationFrame(repairSupergeo);
  };
  // Varios: títulos negros y en negrita, como se solicita.
  const st=document.createElement('style');st.textContent='.variosBlockTitle{color:#000!important;font-weight:800!important;}';document.head.appendChild(st);
})();
</script>


<script>
(function(){
  S.drawings=Array.isArray(S.drawings)?S.drawings:[];
  S.wallpaperDrawingId=S.wallpaperDrawingId||null;

  function getDrawing(id){return S.drawings.find(d=>d.id===id)||null;}
  function currentWallpaper(){return getDrawing(S.wallpaperDrawingId);}

  window.saveDrawing46=function(){
    const c=el('#canvas');
    if(!c){alert('No se encuentra el lienzo de dibujo.');return;}
    const name=(prompt('Nombre del dibujo:','Mi dibujo')||'').trim();
    if(!name)return;
    try{
      const data=c.toDataURL('image/png');
      const id='drawing_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
      S.drawings.push({id:id,name:name,data:data,created:new Date().toISOString()});
      save();
      render();
    }catch(e){console.error(e);alert('No se ha podido guardar el dibujo.');}
  };

  window.setDrawingWallpaper46=function(id){
    if(!getDrawing(id))return;
    S.wallpaperDrawingId=id;
    save();
    render();
  };

  window.clearDrawingWallpaper46=function(){
    S.wallpaperDrawingId=null;
    save();
    render();
  };

  window.deleteDrawing46=function(id){
    const d=getDrawing(id);
    if(!d)return;
    if(!confirm('¿Eliminar este dibujo guardado?'))return;
    S.drawings=S.drawings.filter(x=>x.id!==id);
    if(S.wallpaperDrawingId===id)S.wallpaperDrawingId=null;
    save();
    render();
  };

  const oldDraw46=window.draw;
  window.draw=function(){
    let h=oldDraw46();
    const saveButton='<button type="button" class="btn" id="saveDrawing46" style="margin-top:12px">💾 Guardar dibujo</button>';
    if(h.includes('</canvas>')) h=h.replace('</canvas>','</canvas>'+saveButton);
    else h+=saveButton;

    const list=S.drawings.map(d=>{
      const active=S.wallpaperDrawingId===d.id;
      return `<div class="card savedDrawing46" style="margin-top:10px"><div class="row" style="align-items:center;justify-content:space-between;gap:12px"><div class="row" style="align-items:center;gap:10px"><img src="${d.data}" alt="${esc(d.name)}" style="width:110px;height:75px;object-fit:contain;border:1px solid #ddd;border-radius:8px;background:#fff"><div><b>${esc(d.name)}</b>${active?'<div class="small">⭐ Fondo de inicio seleccionado</div>':''}</div></div><div class="row" style="gap:6px"><button type="button" class="btn secondary drawingWallpaper46" data-id="${d.id}">${active?'⭐ Fondo activo':'🖼️ Usar como fondo de inicio'}</button><button type="button" class="btn danger drawingDelete46" data-id="${d.id}">🗑️ Eliminar</button><button type="button" class="btn secondary drawingFullscreen48Btn" data-id="${d.id}">⛶ Pantalla completa</button></div></div></div>`;
    }).join('')||'<p class="small">Todavía no hay dibujos guardados.</p>';

    h+=`<div class="card" style="margin-top:14px"><h3>🖼️ Dibujos guardados</h3><p class="small">Guarda tus dibujos y selecciona cualquiera como fondo al iniciar Litternotes.</p>${list}${S.wallpaperDrawingId?'<button type="button" class="btn secondary" id="clearWallpaper46" style="margin-top:8px">❌ Quitar fondo de inicio</button>':''}</div>`;
    return h;
  };

  function bindDrawingSaved46(){
    const saveBtn=el('#saveDrawing46');
    if(saveBtn)saveBtn.onclick=window.saveDrawing46;
    document.querySelectorAll('.drawingWallpaper46').forEach(b=>b.onclick=()=>window.setDrawingWallpaper46(b.dataset.id));
    document.querySelectorAll('.drawingDelete46').forEach(b=>b.onclick=()=>window.deleteDrawing46(b.dataset.id));
    const clear=el('#clearWallpaper46');
    if(clear)clear.onclick=window.clearDrawingWallpaper46;
  }

  const oldRender46=window.render;
  window.render=function(){
    oldRender46();
    if(S.section==='draw')bindDrawingSaved46();
    const page=el('#page');
    const d=currentWallpaper();
    if(page && S.section==='home' && d){
      page.style.backgroundImage=`linear-gradient(rgba(255,255,255,.78),rgba(255,255,255,.78)),url("${d.data}")`;
      page.style.backgroundSize='cover';
      page.style.backgroundPosition='center';
      page.style.backgroundAttachment='fixed';
      page.style.borderRadius='16px';
    }else if(page){
      page.style.backgroundImage='';
      page.style.backgroundSize='';
      page.style.backgroundPosition='';
      page.style.backgroundAttachment='';
      page.style.borderRadius='';
    }
  };

  const css=document.createElement('style');
  css.textContent='.savedDrawing46{padding:10px}.savedDrawing46 .row{flex-wrap:wrap}.savedDrawing46 img{flex:0 0 auto}';
  document.head.appendChild(css);
})();

<script>
/* ===== v98: NOTAS - implementación única y definitiva ===== */
(function(){
  function parseGrade(v){
    if(v && typeof v==='object') v=v.value ?? v.nota ?? v.grade;
    let s=String(v==null?'':v).trim().replace(',', '.');
    if(!s) return null;
    let n=Number(s);
    if(!Number.isFinite(n)) return null;
    // Compatibilidad con datos antiguos guardados incorrectamente: 800 -> 8,00.
    if(n>10){
      if(n>=100 && n<=1000) n=n/100;
      else if(n>10 && n<100) n=n/10;
    }
    if(n<0 || n>10) return null;
    return Math.round(n*100)/100;
  }
  function fmt(n){ return Number(n).toFixed(2).replace('.',','); }
  function normalize(){
    if(!S.grades || typeof S.grades!=='object' || Array.isArray(S.grades)) S.grades={};
    let changed=false;
    Object.keys(S.grades).forEach(function(subject){
      let old=Array.isArray(S.grades[subject])?S.grades[subject]:[];
      let arr=old.map(parseGrade).filter(function(x){return x!==null;});
      if(JSON.stringify(arr)!==JSON.stringify(old)) changed=true;
      S.grades[subject]=arr;
    });
    if(changed) save();
  }
  function drawNotes(){
    if(S.section!=='grades') return;
    normalize();
    const page=el('#page'); if(!page) return;
    page.innerHTML='';
    const title=document.createElement('h1'); title.textContent='Notas'; page.appendChild(title);

    const addSubject=document.createElement('button');
    addSubject.type='button'; addSubject.className='btn'; addSubject.textContent='➕ Añadir asignatura';
    addSubject.onclick=function(){
      const name=(prompt('Nombre de la asignatura:','')||'').trim();
      if(!name) return;
      if(Object.prototype.hasOwnProperty.call(S.grades,name)){ alert('Esa asignatura ya existe.'); return; }
      S.grades[name]=[]; save(); drawNotes();
    };
    const top=document.createElement('div'); top.className='card'; top.appendChild(addSubject); page.appendChild(top);

    const subjects=Object.keys(S.grades);
    const all=[]; subjects.forEach(function(s){ all.push(...S.grades[s]); });
    const total=all.length ? all.reduce((a,b)=>a+b,0)/all.length : 0;
    const totalCard=document.createElement('div'); totalCard.className='gradesTop';
    totalCard.innerHTML='<div class="card" style="text-align:center"><div class="small">MEDIA TOTAL</div><div class="avg">'+fmt(total)+'</div></div>';
    page.appendChild(totalCard);

    const grid=document.createElement('div'); grid.className='grid'; grid.style.marginTop='16px'; page.appendChild(grid);
    if(!subjects.length){
      const empty=document.createElement('div'); empty.className='card'; empty.textContent='Todavía no hay asignaturas.'; grid.appendChild(empty); return;
    }

    subjects.forEach(function(subject){
      const arr=S.grades[subject];
      const card=document.createElement('div'); card.className='card subject';
      const h=document.createElement('h3'); h.textContent=subject; card.appendChild(h);
      const lab=document.createElement('div'); lab.className='small'; lab.textContent='Media de la asignatura'; card.appendChild(lab);
      const avg=document.createElement('div'); avg.style.cssText='font-size:24px;font-weight:900'; card.appendChild(avg);
      const list=document.createElement('div'); list.style.marginTop='12px'; card.appendChild(list);

      function updateAverage(){
        const nums=arr.map(parseGrade).filter(x=>x!==null);
        const a=nums.length?nums.reduce((x,y)=>x+y,0)/nums.length:0;
        avg.textContent=fmt(a);
      }

      arr.forEach(function(note,index){
        const row=document.createElement('div');
        row.style.cssText='display:flex;align-items:center;gap:7px;margin:8px 0;flex-wrap:wrap';
        const input=document.createElement('input');
        input.type='text'; input.inputMode='decimal'; input.className='field'; input.value=fmt(note);
        input.style.cssText='width:90px;font-weight:700;text-align:center';
        const edit=document.createElement('button'); edit.type='button'; edit.className='btn secondary'; edit.textContent='✏️ Modificar';
        edit.style.cssText='font-size:11px;padding:5px 8px';
        const del=document.createElement('button'); del.type='button'; del.className='btn danger'; del.textContent='🗑️ Eliminar';
        del.style.cssText='font-size:11px;padding:5px 8px';
        function modify(){
          const n=parseGrade(input.value);
          if(n===null){ alert('Introduce una nota válida entre 0,00 y 10,00.'); input.value=fmt(arr[index]); return; }
          arr[index]=n; S.grades[subject]=arr; save(); drawNotes();
        }
        edit.onclick=modify;
        input.addEventListener('change',modify);
        del.onclick=function(){
          if(!confirm('¿Eliminar esta nota?')) return;
          arr.splice(index,1); S.grades[subject]=arr; save(); drawNotes();
        };
        row.appendChild(input); row.appendChild(edit); row.appendChild(del); list.appendChild(row);
      });

      const add=document.createElement('button'); add.type='button'; add.className='btn secondary'; add.textContent='➕ Añadir nota'; add.style.marginTop='8px';
      add.onclick=function(){
        const raw=prompt('Nueva nota (ejemplo: 7,25):','7,00'); if(raw===null)return;
        const n=parseGrade(raw); if(n===null){alert('Introduce una nota válida entre 0,00 y 10,00.');return;}
        arr.push(n); S.grades[subject]=arr; save(); drawNotes();
      };
      card.appendChild(add); updateAverage(); grid.appendChild(card);
    });
  }

  window.grades=drawNotes;
  const previousRender=window.render;
  window.render=function(){
    // Para Notas NO se ejecutan los renderizadores antiguos: así ninguno puede sobrescribir esta versión.
    if(S.section==='grades'){ drawNotes(); return; }
    previousRender();
  };
  if(S.section==='grades') drawNotes();
})();
</script>

    const value=prompt('Introduce la nota (0 a 10):','8');
    if(value===null)return;
    const n=Number(String(value).replace(',','.'));
    if(!Number.isFinite(n)||n<0||n>10){alert('La nota debe estar entre 0 y 10.');return;}
    if(!Array.isArray(S.grades[s]))S.grades[s]=[];
    S.grades[s].push(Math.round(n*100)/100); save(); render();
  };
  window.addSubjectV80=function(){
    let s=prompt('Nombre de la asignatura:'); if(!s)return; s=s.trim(); if(!s)return;
    if(!Array.isArray(S.grades[s]))S.grades[s]=[]; save(); render();
  };
  window.delGradeV80=function(subject,index){
    if(!S.grades[subject])return; S.grades[subject].splice(index,1);
    if(!S.grades[subject].length)delete S.grades[subject]; save(); render();
  };
  window.grades=function(){
    const vals=Object.values(S.grades).flat().filter(n=>Number.isFinite(Number(n)));
    const overall=vals.length?vals.reduce((a,b)=>a+Number(b),0)/vals.length:0;
    return `<h1>Notas</h1>
      <div class="card notesAddSubject"><button class="btn" style="background:#facc15;color:#111" onclick="addSubjectV80()">➕ Añadir asignatura</button></div>
      <div class="gradesTop"><div class="card" style="text-align:center"><div class="small">MEDIA TOTAL</div><div class="avg overallAvg">${overall.toFixed(2).replace('.',',')}</div></div></div>
      <div class="grid" style="margin-top:16px">${Object.entries(S.grades).map(function(entry){
        const s=entry[0], g=entry[1];
        const a=g.length?g.reduce((x,y)=>x+Number(y),0)/g.length:0;
        const safe=noteEsc(s);
        return `<div class="card subject"><h3 class="noteSubjectTitle">${esc(s)}</h3>
          <div class="small">Media de la asignatura</div><div style="font-size:24px;font-weight:900">${a.toFixed(2).replace('.',',')}</div>
          <div>${g.map(function(n,i){return `<span class="grade ${Number(n)<5?'bad':''}">${Number(n).toString().replace('.',',')} <button type="button" title="Editar nota" onclick="editGradeV80('${safe}',${i})">✏️</button> <button type="button" title="Eliminar nota" onclick="delGradeV80('${safe}',${i})">×</button></span>`}).join('')}</div>

  /* ---------- RÍOS: desplegable España / Mundo ---------- */
  const riversWorld=[
    ['Amazonas','Brasil, Perú, Colombia'],['Nilo','Uganda, Sudán del Sur, Sudán, Egipto'],['Misisipi','Estados Unidos'],
    ['Yangtsé','China'],['Mekong','China, Myanmar, Laos, Tailandia, Camboya, Vietnam'],['Danubio','Alemania, Austria, Eslovaquia, Hungría, Croacia, Serbia, Rumanía, Bulgaria'],
    ['Ganges','India, Bangladés'],['Rin','Suiza, Liechtenstein, Austria, Alemania, Francia, Países Bajos'],['Volga','Rusia'],['Zambeze','Zambia, Angola, Namibia, Botsuana, Zimbabue, Mozambique']
  ];
  function riverQuestionV80(){
    const mode=el('#geoRiverType')?.value||'spain';
    const data=mode==='world'?riversWorld:GEO.rivers;
    const q=data[Math.floor(Math.random()*data.length)];
    const places=String(q[1]).split(/, | y /).map(x=>x.trim()).filter(Boolean);
    const correct=places[Math.floor(Math.random()*places.length)];
    const all=Array.from(new Set(data.flatMap(r=>String(r[1]).split(/, | y /).map(x=>x.trim()).filter(Boolean))));
    const opts=[correct,...all.filter(x=>x!==correct).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);
    el('#geoRQuestion').textContent=mode==='world'?`¿Por qué país pasa el río ${q[0]}?`:`¿Por qué provincia pasa el río ${q[0]}?`;
    el('#geoROptions').innerHTML=opts.map(o=>`<button type="button" class="btn secondary" onclick="riverAnswerV80(this,'${esc(o).replace(/'/g,"\\'")}','${esc(correct).replace(/'/g,"\\'")}')">${esc(o)}</button>`).join('');
    const r=el('#geoRiverResult'); if(r)r.textContent='';
  }
  window.riverAnswerV80=function(btn,a,c){const r=el('#geoRiverResult');if(r)r.textContent=a===c?'✅ Correcto':'❌ No. Respuesta: '+c;setTimeout(riverQuestionV80,900)};
  window.geoRiver=function(){riverQuestionV80()};

  /* ---------- MONTAÑAS / MARES / OCÉANOS: dos bancos independientes ---------- */
  const mountainsV80=[
    ['Everest','¿Cuál es la montaña más alta de la Tierra sobre el nivel del mar?'],['Andes','¿Qué gran cordillera se extiende por el oeste de América del Sur?'],
    ['Himalaya','¿En qué cordillera se encuentra el monte Everest?'],['Pirineos','¿Qué cordillera forma gran parte de la frontera natural entre España y Francia?'],
    ['Teide','¿Cuál es la montaña más alta de España?'],['Mulhacén','¿Cuál es el pico más alto de la península ibérica?'],
    ['Alpes','¿Qué gran cordillera europea atraviesa países como Francia, Suiza, Italia y Austria?'],['Montañas Rocosas','¿Qué gran cordillera recorre el oeste de América del Norte?']
  ];
  const seasOceansV80=[
    ['Atlántico','¿Qué océano separa principalmente América de Europa y África?'],['Pacífico','¿Cuál es el océano más extenso de la Tierra?'],

    ['Cantábrico','¿Qué mar baña la costa norte de España?'],['Mar del Norte','¿Qué mar se encuentra entre Gran Bretaña y Europa continental?'],
    ['Caribe','¿Qué mar se encuentra al este de América Central y al norte de América del Sur?'],['Mar Rojo','¿Qué mar se encuentra entre el noreste de África y la península arábiga?']
  ];
  function reliefQuestionV80(){
    const kind=Math.random()<0.5?'mountain':'sea';
    const data=kind==='mountain'?mountainsV80:seasOceansV80;
    const q=data[Math.floor(Math.random()*data.length)], answer=q[0];
    const wrong=data.filter(x=>x[0]!==answer).sort(()=>Math.random()-.5).slice(0,3).map(x=>x[0]);
    const opts=[answer,...wrong].sort(()=>Math.random()-.5);
    const qe=el('#geoReliefQuestion'),oe=el('#geoReliefOptions'),re=el('#geoReliefResult');
    if(!qe||!oe)return;
    qe.textContent=q[1];
    oe.innerHTML=opts.map(o=>`<button type="button" class="btn secondary" onclick="reliefAnswerV80(this,'${esc(o).replace(/'/g,"\\'")}','${esc(answer).replace(/'/g,"\\'")}')">${esc(o)}</button>`).join('');
    if(re)re.textContent='';
  }
  window.reliefAnswerV80=function(btn,a,c){const r=el('#geoReliefResult');if(r)r.textContent=a===c?'✅ Correcto':'❌ No. Respuesta: '+c;setTimeout(reliefQuestionV80,900)};
  window.geoRelief=function(){reliefQuestionV80()};

  /* ---------- Supergeografía: render definitivo con los 8 bloques ---------- */
  window.supergeo=function(){return `<h1>Supergeografía</h1><p class="small">Practica con 8 bloques de preguntas.</p><div class="geoGrid">
${card('<div class="geoCard" id="geoCap"><h3 class="geoBlockTitle">🌍 Capitales de países</h3><label class="small">Continente</label><select id="geoContinent" class="field full" onchange="geoCapital()">'+Object.keys(GEO.capitals).map(c=>`<option>${c}</option>`).join('')+'</select><div id="geoCapQuestion" class="geoQuestion"></div><div id="geoCapOptions" class="geoOptions"></div><div class="geoResult"></div></div>')}
${card('<div class="geoCard" id="geoCCAA"><h3 class="geoBlockTitle">🏛️ Comunidades autónomas españolas</h3><div id="geoCQuestion" class="geoQuestion"></div><div id="geoCOptions" class="geoOptions"></div><div class="geoResult"></div></div>')}
${card('<div class="geoCard" id="geoRiver"><h3 class="geoBlockTitle">🌊 Ríos de España</h3><label class="small">Tipo de ríos</label><select id="geoRiverType" class="field full" onchange="geoRiver()"><option value="spain">Ríos de España</option><option value="world">Ríos del mundo</option></select><div id="geoRQuestion" class="geoQuestion"></div><div id="geoROptions" class="geoOptions"></div><div id="geoRiverResult" class="geoResult"></div></div>')}
${card('<div class="geoCard" id="geoBody"><h3 class="geoBlockTitle">🧍 Partes del cuerpo humano</h3><div id="geoBodyQuestion" class="geoQuestion"></div><div id="geoBodyOptions" class="geoOptions"></div><div class="geoResult"></div></div>')}
${card('<div class="geoCard" id="geoChem"><h3 class="geoBlockTitle">⚗️ Símbolos químicos</h3><div id="geoChemQuestion" class="geoQuestion"></div><div id="geoChemOptions" class="geoOptions"></div><div class="geoResult"></div></div>')}
${card('<div class="geoCard" id="geoRelief"><h3 class="geoBlockTitle">🏔️ Montañas, mares y océanos</h3><div id="geoReliefQuestion" class="geoQuestion"></div><div id="geoReliefOptions" class="geoOptions"></div><div id="geoReliefResult" class="geoResult"></div></div>')}
${card('<div class="geoCard" id="geoHist"><h3 class="geoBlockTitle">📜 Historia de España</h3><div id="geoHistQuestion" class="geoQuestion"></div><div id="geoHistOptions" class="geoOptions"></div><div class="geoResult"></div></div>')}
${card('<div class="geoCard" id="geoInst"><h3 class="geoBlockTitle">📏 Aparatos e instrumentos de medida</h3><div id="geoInstQuestion" class="geoQuestion"></div><div id="geoInstOptions" class="geoOptions"></div><div class="geoResult"></div></div>')}
</div>`};

  /* ---------- Inicialización segura tras cualquier render ---------- */
  const prevRenderV80=window.render;
  window.render=function(){
    prevRenderV80();
    if(S.section==='supergeo'){
      const page=el('#page');
      if(page){page.innerHTML=window.supergeo();bind();geoCapital();geoCCAA();geoRiver();geoBody();geoChem();reliefQuestionV80();geoHistory();geoInstrument();}
    }else if(S.section==='grades'){
      /* render() ya usa grades(); esta rama solo asegura que los valores siguen saneados. */

  };
  if(S.section==='supergeo')setTimeout(window.render,0);
})();

<script>
/* ================= LITTERNOTES v81 - DIBUJO AVANZADO ================= */
(function(){
  S.drawings=Array.isArray(S.drawings)?S.drawings:[];
  S.wallpaperDrawingId=S.wallpaperDrawingId||null;
  let editId=null;
  let pendingLoad=null;

  function getD(id){return S.drawings.find(d=>d.id===id)||null}
  function canvasCtx(){const c=el('#canvas');return c?c.getContext('2d'):null}
  function resizeAndClearCanvas(){
    const c=el('#canvas'); if(!c)return;
    const ctx=c.getContext('2d');
    const d=window.devicePixelRatio||1;
    c.width=Math.max(1,Math.floor(c.clientWidth*d)); c.height=Math.max(1,Math.floor(c.clientHeight*d));
    ctx.setTransform(d,0,0,d,0,0); ctx.clearRect(0,0,c.clientWidth,c.clientHeight);
  }
  function loadImageIntoCanvas(data,done){
    const c=el('#canvas'); if(!c||!data)return;
    const img=new Image(); img.onload=function(){
      const ctx=c.getContext('2d'),d=window.devicePixelRatio||1;
      const cw=c.clientWidth,ch=c.clientHeight;
      ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,cw,ch);
      const scale=Math.min(cw/img.width,ch/img.height,1),w=img.width*scale,h=img.height*scale;
      ctx.drawImage(img,(cw-w)/2,(ch-h)/2,w,h); if(done)done();
    }; img.onerror=()=>alert('No se ha podido cargar el dibujo guardado.'); img.src=data;
  }
  function newDrawing(){editId=null;resizeAndClearCanvas();const lab=el('#drawMode81');if(lab)lab.textContent='Nuevo dibujo';}
  function saveOrUpdate(){
    const c=el('#canvas');if(!c){alert('No se encuentra el lienzo.');return}
    const name=(prompt(editId?'Nombre del dibujo (puedes cambiarlo):':'Nombre del dibujo: ',getD(editId)?.name||'Mi dibujo')||'').trim();if(!name)return;
    const data=c.toDataURL('image/png');
    if(editId){const d=getD(editId);if(d){d.name=name;d.data=data;d.updated=new Date().toISOString();save();render();return}}
    const id='drawing81_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
    S.drawings.push({id,name,data,created:new Date().toISOString()});save();render();
  }
  function editSaved(id){const d=getD(id);if(!d)return;editId=id;render();setTimeout(()=>loadImageIntoCanvas(d.data,()=>{const lab=el('#drawMode81');if(lab)lab.textContent='Modificando: '+d.name}),120)}
  function deleteSaved(id){if(!getD(id))return;if(!confirm('¿Eliminar este dibujo guardado?'))return;S.drawings=S.drawings.filter(x=>x.id!==id);if(S.wallpaperDrawingId===id)S.wallpaperDrawingId=null;if(editId===id)editId=null;save();render()}
  function setWallpaper(id){if(!getD(id))return;S.wallpaperDrawingId=id;save();render()}
  function clearWallpaper(){S.wallpaperDrawingId=null;save();render()}

  function addEmoji(emoji){
    const c=el('#canvas');if(!c)return;const ctx=c.getContext('2d'),d=window.devicePixelRatio||1;ctx.setTransform(d,0,0,d,0,0);ctx.font='48px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(emoji,c.clientWidth/2,c.clientHeight/2);
  }
  function diagram(type){
    const c=el('#canvas');if(!c)return;const ctx=c.getContext('2d'),d=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;ctx.setTransform(d,0,0,d,0,0);ctx.strokeStyle=el('#drawColor')?.value||'#111';ctx.fillStyle='#fff';ctx.lineWidth=2;ctx.font='16px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    const box=(x,y,bw,bh,t)=>{ctx.strokeRect(x,y,bw,bh);ctx.fillText(t,x+bw/2,y+bh/2)};
    if(type==='flow'){box(40,30,w-80,48,'INICIO');box(40,h-78,w-80,48,'FIN');ctx.beginPath();ctx.moveTo(w/2,78);ctx.lineTo(w/2,h-78);ctx.stroke();}
    if(type==='mind'){ctx.beginPath();ctx.arc(w/2,h/2,55,0,Math.PI*2);ctx.stroke();ctx.fillText('IDEA',w/2,h/2);[['ARRIBA',w/2,45],['DERECHA',w-70,h/2],['ABAJO',w/2,h-35],['IZQUIERDA',70,h/2]].forEach(a=>{box(a[1]-45,a[2]-20,90,40,a[0]);ctx.beginPath();ctx.moveTo(w/2,h/2);ctx.lineTo(a[1],a[2]);ctx.stroke()})}
    if(type==='cycle'){const pts=[[w/2,45],[w-90,h/2],[w/2,h-45],[90,h/2]];pts.forEach((p,i)=>{ctx.beginPath();ctx.arc(p[0],p[1],35,0,Math.PI*2);ctx.stroke();ctx.fillText('PASO '+(i+1),p[0],p[1]);});for(let i=0;i<4;i++){const a=pts[i],b=pts[(i+1)%4];ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}}
    if(type==='venn'){ctx.beginPath();ctx.arc(w/2-45,h/2,70,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(w/2+45,h/2,70,0,Math.PI*2);ctx.stroke();ctx.fillText('A',w/2-80,h/2);ctx.fillText('A + B',w/2,h/2);ctx.fillText('B',w/2+80,h/2)}
  }
  function importImageFile(file){if(!file)return;const rd=new FileReader();rd.onload=()=>loadImageIntoCanvas(rd.result);rd.readAsDataURL(file)}
  function importImageUrl(){const url=(el('#drawImageUrl81')?.value||'').trim();if(!url)return;const img=new Image();img.crossOrigin='anonymous';img.onload=()=>{const c=el('#canvas');if(!c)return;const ctx=c.getContext('2d'),d=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight,s=Math.min(w/img.width,h/img.height,1),iw=img.width*s,ih=img.height*s;ctx.setTransform(d,0,0,d,0,0);ctx.drawImage(img,(w-iw)/2,(h-ih)/2,iw,ih)};img.onerror=()=>alert('No se pudo cargar esa imagen. Si procede de Pixabay, usa el enlace directo de la imagen o descárgala y utiliza "Cargar imagen".');img.src=url}

  window.editDrawing81=editSaved;
  window.saveOrUpdateDrawing81=saveOrUpdate;
  window.newDrawing81=newDrawing;
  window.deleteDrawing81=deleteSaved;
  window.setDrawingWallpaper81=setWallpaper;
  window.clearDrawingWallpaper81=clearWallpaper;
  window.addDrawingEmoji81=addEmoji;
  window.addDrawingDiagram81=diagram;
  window.importDrawingUrl81=importImageUrl;

  const baseDraw81=window.draw;
  window.draw=function(){
    let h=baseDraw81();
    const tools=`<div class="drawPanel81"><b>🧰 Herramientas creativas</b><div class="drawTools81">
      <button type="button" class="btn secondary" onclick="newDrawing81()">🆕 Nuevo dibujo</button>
      <button type="button" class="btn" onclick="saveOrUpdateDrawing81()">💾 ${editId?'Actualizar dibujo':'Guardar dibujo'}</button>
      <label class="btn secondary" style="cursor:pointer">🖼️ Cargar imagen<input id="drawImageFile81" type="file" accept="image/*" style="display:none"></label>
      <input id="drawImageUrl81" class="field" placeholder="URL de imagen" style="min-width:190px">
      <button type="button" class="btn secondary" onclick="importDrawingUrl81()">➕ Insertar imagen</button>
    </div>
    <div class="drawTools81"><b>📐 Diagramas:</b>
      <button type="button" class="btn secondary" onclick="addDrawingDiagram81('flow')">Flujo</button>
      <button type="button" class="btn secondary" onclick="addDrawingDiagram81('mind')">Mapa mental</button>
      <button type="button" class="btn secondary" onclick="addDrawingDiagram81('cycle')">Ciclo</button>
      <button type="button" class="btn secondary" onclick="addDrawingDiagram81('venn')">Venn</button>
    </div>
    <div class="drawTools81"><b>😀 Emoticonos:</b>${['😀','😂','😍','😎','🤔','😢','😡','👍','❤️','⭐','🌈','🚀'].map(e=>`<button type="button" class="drawEmoji81" onclick="addDrawingEmoji81('${e}')">${e}</button>`).join('')}</div>
    <div class="drawTools81"><b>🖼️ Pixabay:</b><button type="button" class="btn secondary" id="drawPixabay81">🔎 Buscar imágenes gratuitas en Pixabay</button><span class="small">Después puedes descargar una imagen e importarla con «Cargar imagen».</span></div>
    </div><div id="drawMode81" class="small" style="margin-top:8px">${editId&&getD(editId)?'Modificando: '+esc(getD(editId).name):'Nuevo dibujo'}</div>`;
    h+=tools;
    const list=S.drawings.map(d=>`<div class="savedDrawing81"><div class="row" style="align-items:center;justify-content:space-between;gap:12px"><div class="row" style="align-items:center;gap:10px"><img src="${d.data}" alt="${esc(d.name)}"><div><b>${esc(d.name)}</b><div class="small">${d.updated?'Modificado':'Guardado'}</div></div></div><div class="drawTools81"><button type="button" class="btn" onclick="editDrawing81('${d.id}')">✏️ Modificar</button><button type="button" class="btn secondary" onclick="setDrawingWallpaper81('${d.id}')">⭐ Fondo</button><button type="button" class="btn danger" onclick="deleteDrawing81('${d.id}')">🗑️ Eliminar</button></div></div></div>`).join('')||'<p class="small">Todavía no hay dibujos guardados.</p>';
    h+=`<div class="card" style="margin-top:14px"><h3>🖼️ Dibujos guardados</h3><p class="small">Puedes abrir cualquiera para modificarlo, volver a guardarlo o usarlo como fondo.</p>${list}${S.wallpaperDrawingId?'<button type="button" class="btn secondary" id="clearDrawingWallpaper81" style="margin-top:8px">❌ Quitar fondo</button>':''}</div>`;
    return h;
  };

  const oldRender81=window.render;
  window.render=function(){oldRender81();if(S.section==='draw'){bindDrawing81();if(pendingLoad){const x=pendingLoad;pendingLoad=null;setTimeout(()=>loadImageIntoCanvas(x.data),80)}}};
  function bindDrawing81(){
    const f=el('#drawImageFile81');if(f)f.onchange=e=>importImageFile(e.target.files?.[0]);
    const pb=el('#drawPixabay81');if(pb)pb.onclick=()=>{const q=window.prompt('¿Qué imagen quieres buscar en Pixabay?','naturaleza');if(q)window.open('https://pixabay.com/es/images/search/'+encodeURIComponent(q)+'/','_blank')};
    const cw=el('#clearDrawingWallpaper81');if(cw)cw.onclick=clearWallpaper;
  }
})();
</script>

    totalCard.innerHTML='<div class="card" style="text-align:center"><div class="small">MEDIA TOTAL</div><div class="avg">'+fmt(total)+'</div></div>';
    page.appendChild(totalCard);

    const grid=document.createElement('div'); grid.className='grid'; grid.style.marginTop='16px'; page.appendChild(grid);
    if(!subjects.length){
      const empty=document.createElement('div'); empty.className='card'; empty.textContent='Todavía no hay asignaturas.'; grid.appendChild(empty); return;
    }

    subjects.forEach(function(subject){
      const arr=S.grades[subject];
      const card=document.createElement('div'); card.className='card subject';
      const h=document.createElement('h3'); h.textContent=subject; card.appendChild(h);
      const lab=document.createElement('div'); lab.className='small'; lab.textContent='Media de la asignatura'; card.appendChild(lab);
      const avg=document.createElement('div'); avg.style.cssText='font-size:24px;font-weight:900'; card.appendChild(avg);
      const list=document.createElement('div'); list.style.marginTop='12px'; card.appendChild(list);

      function updateAverage(){
        const nums=arr.map(parseGrade).filter(x=>x!==null);
        const a=nums.length?nums.reduce((x,y)=>x+y,0)/nums.length:0;
        avg.textContent=fmt(a);
      }

      arr.forEach(function(note,index){
        const row=document.createElement('div');
        row.style.cssText='display:flex;align-items:center;gap:7px;margin:8px 0;flex-wrap:wrap';
        const input=document.createElement('input');
        input.type='text'; input.inputMode='decimal'; input.className='field'; input.value=fmt(note);
        input.style.cssText='width:90px;font-weight:700;text-align:center';
        const edit=document.createElement('button'); edit.type='button'; edit.className='btn secondary'; edit.textContent='✏️ Modificar';
        edit.style.cssText='font-size:11px;padding:5px 8px';
        const del=document.createElement('button'); del.type='button'; del.className='btn danger'; del.textContent='🗑️ Eliminar';
        del.style.cssText='font-size:11px;padding:5px 8px';
        function modify(){
          const n=parseGrade(input.value);

          arr[index]=n; S.grades[subject]=arr; save(); drawNotes();
        }
        edit.onclick=modify;
        input.addEventListener('change',modify);
        del.onclick=function(){
          if(!confirm('¿Eliminar esta nota?')) return;
          arr.splice(index,1); S.grades[subject]=arr; save(); drawNotes();
        };
        row.appendChild(input); row.appendChild(edit); row.appendChild(del); list.appendChild(row);
      });

      const add=document.createElement('button'); add.type='button'; add.className='btn notesGreenButton'; add.textContent='➕ Añadir nota'; add.style.marginTop='8px';
      add.onclick=function(){
        const raw=prompt('Nueva nota (ejemplo: 7,25):','7,00'); if(raw===null)return;
        const n=parseGrade(raw); if(n===null){alert('Introduce una nota válida entre 0,00 y 10,00.');return;}
        arr.push(n); S.grades[subject]=arr; save(); drawNotes();
      };
      card.appendChild(add); updateAverage(); grid.appendChild(card);
    });
  }

  window.grades=drawNotes;
  const previousRender=window.render;
  window.render=function(){
    // Para Notas NO se ejecutan los renderizadores antiguos: así ninguno puede sobrescribir esta versión.
    if(S.section==='grades'){ drawNotes(); return; }
    previousRender();
  };
  if(S.section==='grades') drawNotes();
})();
</script>

<script>
/* ===== Litternotes v112: Cálculos matemáticos - nivel 1.º ESO ===== */
(function(){
  function sh112(a){return a.slice().sort(function(){return Math.random()-.5;});}
  function r112(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
  function fmt112(n){
    if(Math.abs(n-Math.round(n))<1e-10)return String(Math.round(n));
    return String(Number(n.toFixed(2))).replace('.',',');
  }
  function gcd112(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a||1;}
  function frac112(n,d){
    if(d<0){n=-n;d=-d;}
    const g=gcd112(n,d); return [n/g,d/g];
  }
  function fracText112(n,d){
    const f=frac112(n,d); return f[1]===1?String(f[0]):f[0]+'/'+f[1];
  }
  function makeMath112(){
    const type=r112(1,10);
    let q='',ans='',opts=[];
    if(type===1){
      const a=r112(-15,15),b=r112(-15,15); ans=fmt112(a+b); q=`Calcula: ${a} + (${b})`; steps=`${a} + (${b}) = ${ans}`;
      opts=[ans,fmt112(a-b),fmt112(Math.abs(a)+Math.abs(b)),fmt112(-(a+b))];
    } else if(type===2){
      const a=r112(-15,15),b=r112(-15,15); ans=fmt112(a-b); q=`Calcula: ${a} − (${b})`; steps=`${a} − (${b}) = ${ans}`;
      opts=[ans,fmt112(a+b),fmt112(b-a),fmt112(Math.abs(a-b))];
    } else if(type===3){
      const a=r112(-9,9)||3,b=r112(-9,9)||-2; ans=fmt112(a*b); q=`Calcula: ${a} × (${b})`; steps=`${a} × (${b}) = ${ans}`;
      opts=[ans,fmt112(a+b),fmt112(a-b),fmt112(a*b*-1)];
    } else if(type===4){
      const b=r112(2,9),a=r112(-9,9)*b; ans=fmt112(a/b); q=`Calcula: ${a} ÷ ${b}`; steps=`${a} ÷ ${b} = ${ans}`;
      opts=[ans,fmt112(a*b),fmt112(a-b),fmt112(b/a)];
    } else if(type===5){
      const a=r112(2,6),b=r112(2,5),c=r112(1,9); ans=fmt112(a+b*c); q=`Calcula: ${a} + ${b} × ${c}`; steps=`Primero ${b} × ${c} = ${b*c}; después ${a} + ${b*c} = ${ans}`;
      opts=[ans,fmt112((a+b)*c),fmt112(a+b+c),fmt112(a*b+c)];
    } else if(type===6){
      const a=r112(2,5),b=r112(2,4); ans=fmt112(Math.pow(a,b)); q=`Calcula: ${a}<sup>${b}</sup>`; steps=`${a}<sup>${b}</sup> = ${Array(b).fill(a).join(' × ')} = ${ans}`;
      opts=[ans,fmt112(a*b),fmt112(a+b),fmt112(Math.pow(b,a))];
    } else if(type===7){
      const d1=r112(2,8),n1=r112(1,d1-1),d2=r112(2,8),n2=r112(1,d2-1); const n=n1*d2+n2*d1,d=d1*d2; ans=fracText112(n,d);
      q=`Calcula: ${n1}/${d1} + ${n2}/${d2}`; steps=`Denominador común: ${d1} × ${d2} = ${d}. Numeradores: ${n1} × ${d2} + ${n2} × ${d1} = ${n}. Simplificamos: ${ans}`;
      opts=[ans,fracText112(n1*d2-n2*d1,d),fracText112(n1*n2,d),fracText112(n,d+1)];
    } else if(type===8){
      const d1=r112(2,8),n1=r112(1,d1-1),d2=r112(2,8),n2=r112(1,d2-1); const n=n1*d2-n2*d1,d=d1*d2; ans=fracText112(n,d);
      q=`Calcula: ${n1}/${d1} − ${n2}/${d2}`; steps=`Denominador común: ${d1} × ${d2} = ${d}. Numeradores: ${n1} × ${d2} − ${n2} × ${d1} = ${n}. Simplificamos: ${ans}`;
      opts=[ans,fracText112(n1*d2+n2*d1,d),fracText112(n1*n2,d),fracText112(n,d+1)];
    } else if(type===9){
      const x=r112(2,15),a=r112(1,9); ans=fmt112(x); q=`Resuelve: x + ${a} = ${x+a}`; steps=`Restamos ${a} a ambos lados: x = ${x+a} − ${a} = ${ans}`;
      opts=[ans,fmt112(x+a),fmt112(x-a),fmt112(a)];
    } else {
      const p=r112(10,90),base=r112(20,200); ans=fmt112(base*p/100); q=`¿Cuánto es el ${p}% de ${base}?`; steps=`${p}% de ${base} = ${base} × ${p} ÷ 100 = ${ans}`;
      opts=[ans,fmt112(base*(100-p)/100),fmt112(base+p),fmt112(p*base/10)];
    }
    // Garantiza opciones numéricamente distintas y exactamente una correcta.
    opts=[...new Set(opts.map(String))];
    while(opts.length<4){
      const v=ans+'_'+r112(1,99); opts.push(v);
    }
    opts=sh112(opts.slice(0,4));
    return {q,ans,opts,steps};
  }
  function mathQuestion112(){

    oldRender112();
  };
  window.renderMathSuper112=renderMathSuper112;

})();

  const esc126=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const norm126=s=>String(s??'').trim().toLocaleLowerCase('es-ES');
  let map126=null, road126=null, sat126=null, last126=null;

  function loadLeaflet126(){
    if(window.L)return Promise.resolve();
    if(window.__minotesLeaflet126)return window.__minotesLeaflet126;
    window.__minotesLeaflet126=new Promise((resolve,reject)=>{
      if(!document.querySelector('link[data-minotes-leaflet126]')){
        const l=document.createElement('link');l.rel='stylesheet';l.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';l.dataset.minotesLeaflet126='1';document.head.appendChild(l);
      }
      const s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=resolve;s.onerror=()=>reject(new Error('Leaflet no disponible'));document.head.appendChild(s);
    });
    return window.__minotesLeaflet126;
  }

  function mapHTML126(){return `<section class="card v126-map-card"><div class="v125-map-wrap"><div class="v126-map-stage" id="v126MapStage"><div class="v125-map-globe v126-map-globe"><div class="v125-map-sphere"><div class="v125-map-sphere-img" id="v126GlobeImg"></div></div></div><div class="v126-map-detail" id="v126MapDetail"></div><button type="button" class="btn v126-map-back" id="v126MapBack">🌐 Volver a la bola del mundo</button></div><div class="v125-map-panel v126-map-panel"><h2>🌍 Mapa mundi</h2><h3>Localiza un lugar del mundo</h3><p>Escribe el nombre de un pueblo, ciudad o país.</p><input id="v126MapInput" type="text" placeholder="Ej.: Aranjuez, Tokio o Francia"><button type="button" id="v126MapGo">🔎 Localizar</button><div id="v126MapStatus" class="v125-map-status">Busca un lugar para verlo de cerca.</div><div class="v126-map-views" id="v126MapViews"><button type="button" class="btn secondary active" id="v126Road">🗺️ Mapa</button><button type="button" class="btn secondary" id="v126Satellite">🛰️ Satélite</button></div><div class="v126-map-fallback" id="v126MapFallback"></div><p class="small">Mapa: calles y nombres. Satélite: imágenes aéreas. Puedes acercar, alejar y mover el mapa.</p></div></div></section>`}

  async function initMap126(lat,lon,status,views,road,sat,detail,fallback){
    last126={lat,lon};
    try{
      await loadLeaflet126();
      if(!map126){map126=L.map(detail,{zoomControl:true,scrollWheelZoom:true,dragging:true,doubleClickZoom:true}).setView([lat,lon],17)}
      else{map126.setView([lat,lon],17);map126.invalidateSize()}
      if(road126)map126.removeLayer(road126); if(sat126)map126.removeLayer(sat126);
      road126=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map126);
      sat126=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'});
      road.classList.add('active');sat.classList.remove('active');views.style.display='flex';fallback.style.display='none';
      setTimeout(()=>map126.invalidateSize(),150);
      status.innerHTML='<strong>📍 '+esc126(last126.name||'Lugar localizado')+'</strong><br>Vista de calles. Puedes acercar, alejar y mover el mapa.';
      return true;
    }catch(e){
      views.style.display='flex';
      fallback.innerHTML='<a class="btn" target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat='+encodeURIComponent(lat)+'&mlon='+encodeURIComponent(lon)+'#map=17/'+encodeURIComponent(lat)+'/'+encodeURIComponent(lon)+'">🗺️ Abrir mapa de calles con nombres</a>';
      fallback.style.display='block';
      status.textContent='El mapa integrado no está disponible en este dispositivo. Puedes abrir directamente el mapa de calles detallado.';
      return false;
    }
  }

  function bindMap126(){
    const stage=document.getElementById('v126MapStage'),detail=document.getElementById('v126MapDetail'),img=document.getElementById('v126GlobeImg'),input=document.getElementById('v126MapInput'),go=document.getElementById('v126MapGo'),status=document.getElementById('v126MapStatus'),views=document.getElementById('v126MapViews'),road=document.getElementById('v126Road'),sat=document.getElementById('v126Satellite'),back=document.getElementById('v126MapBack'),fallback=document.getElementById('v126MapFallback');
    if(!stage||!detail||!img||!input||!go)return;
    async function locate(){
      const q=input.value.trim();if(!q){status.textContent='Escribe primero el nombre de un lugar.';return}
      go.disabled=true;status.textContent='Buscando '+q+'…';
      try{
        const u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=es&q='+encodeURIComponent(q);
        const rr=await fetch(u,{headers:{Accept:'application/json'}});if(!rr.ok)throw new Error('Geocodificación');
        const data=await rr.json();if(!data.length){status.textContent='No se ha encontrado ese lugar. Comprueba el nombre e inténtalo de nuevo.';return}
        const lat=Number(data[0].lat),lon=Number(data[0].lon);last126={lat,lon,name:data[0].display_name};
        img.style.backgroundPosition=(50+lon/1.8)+'% '+(50-lat/0.9)+'%';img.style.transform='scale(3.2)';
        status.innerHTML='<strong>📍 '+esc126(data[0].display_name)+'</strong><br>Acercando a la zona…';
        await new Promise(r=>setTimeout(r,900));
        stage.classList.add('detail');
        await initMap126(lat,lon,status,views,road,sat,detail,fallback);
      }catch(e){status.textContent='No se ha podido localizar el lugar. Comprueba la conexión a Internet e inténtalo de nuevo.'}
      finally{go.disabled=false}
    }
    go.onclick=locate;input.onkeydown=e=>{if(e.key==='Enter')locate()};
    road.onclick=()=>{
      if(!last126)return;
      if(map126&&road126){if(sat126)map126.removeLayer(sat126);if(!map126.hasLayer(road126))road126.addLayer(road126);road.classList.add('active');sat.classList.remove('active');setTimeout(()=>map126.invalidateSize(),100)}
      else window.open('https://www.openstreetmap.org/?mlat='+encodeURIComponent(last126.lat)+'&mlon='+encodeURIComponent(last126.lon)+'#map=17/'+encodeURIComponent(last126.lat)+'/'+encodeURIComponent(last126.lon),'_blank','noopener');
    };
    sat.onclick=()=>{
      if(!last126)return;
      if(map126&&sat126){if(road126)map126.removeLayer(road126);if(!map126.hasLayer(sat126))map126.addLayer(sat126);sat.classList.add('active');road.classList.remove('active');setTimeout(()=>map126.invalidateSize(),100)}
      else window.open('https://www.google.com/maps/@'+encodeURIComponent(last126.lat)+','+encodeURIComponent(last126.lon)+',17z/data=!3m1!1e3','_blank','noopener');
    };
    back.onclick=()=>{stage.classList.remove('detail');views.style.display='none';fallback.style.display='none';status.textContent='La bola del mundo está lista para localizar otro lugar.';if(map126)setTimeout(()=>map126.invalidateSize(),100)};
  }
  function renderMap126(){const p=document.getElementById('page');if(!p)return;p.innerHTML=mapHTML126();bindMap126();}

  function setupIT126(){
    const root=document.getElementById('lnInfoTerms116');if(!root||typeof INFO116==='undefined')return;
    const item=INFO116[Math.floor(Math.random()*INFO116.length)],answer=item[0],wrong=INFO116.filter(x=>x[0]!==answer).sort(()=>Math.random()-.5).slice(0,3).map(x=>x[0]),opts=[answer,...wrong].sort(()=>Math.random()-.5);
    root.innerHTML='<div class="lnInfoQuestion116"><b>¿Qué término informático corresponde a esta descripción?</b><div class="lnInfoDefinition116">'+esc126(item[1])+'</div></div><div class="lnInfoOpts116">'+opts.map((x,i)=>'<button type="button" class="btn secondary lnInfoOpt116" data-i="'+i+'">'+esc126(x)+'</button>').join('')+'</div><div class="lnInfoResult116"></div>';
    root.querySelectorAll('.lnInfoOpt116').forEach(btn=>btn.onclick=function(){
      if(btn.disabled)return;root.querySelectorAll('.lnInfoOpt116').forEach(b=>b.disabled=true);
      const ok=opts[Number(btn.dataset.i)]===answer,r=root.querySelector('.lnInfoResult116');if(r)r.textContent=ok?'Correcto.':'Incorrecto.';
      setTimeout(()=>{if(document.getElementById('lnInfoTerms116')===root)setupIT126()},900);
    });
  }
  const oldRender126=window.render;
  window.render=function(){const result=oldRender126.apply(this,arguments);setTimeout(()=>{if(typeof S!=='undefined'&&S.section==='worldmap')renderMap126();if(typeof S!=='undefined'&&S.section==='supergeo')setupIT126()},250);return result};
  document.addEventListener('DOMContentLoaded',()=>setTimeout(()=>{if(typeof S!=='undefined'&&S.section==='worldmap')renderMap126();if(typeof S!=='undefined'&&S.section==='supergeo')setupIT126()},500));
  window.LITTERNOTES_VERSION='v126';
})();
</script>

<script>
(function(){

      if(Array.isArray(menu)){
        for(let i=menu.length-1;i>=0;i--){if(menu[i]&&menu[i][0]==='worldmap')menu.splice(i,1)}

  const norm127=s=>String(s??'').trim().toLocaleLowerCase('es-ES');

  /* Ríos: solo Ríos, sin el selector antiguo, y con respuesta automática. */
  function setupRivers127(){

    if(!card||!q||!o||!Array.isArray(GEO.rivers)||!GEO.rivers.length)return;

    const answer=provinces[Math.floor(Math.random()*provinces.length)];
    const all=Array.from(new Set(GEO.rivers.flatMap(r=>String(r[1]).split(/, | y /).map(x=>x.trim()).filter(Boolean))));
    const opts=shuffle127([answer,...shuffle127(all.filter(x=>norm127(x)!==norm127(answer))).slice(0,3)]);
    q.textContent='¿Por qué provincia pasa el río '+item[0]+'?';
    const r=card.querySelector('.geoResult');if(r)r.textContent='';

  function setupHistory127(){
    const q=el('#geoHistQuestion'),o=el('#geoHistOptions'),card=document.getElementById('geoHist');
    if(!q||!o||!card||!Array.isArray(GEO.history)||!GEO.history.length)return;
    const item=GEO.history[Math.floor(Math.random()*GEO.history.length)];
    const answer=String(item[2]??item[0]);
    const isDate=/^\d{3,4}(?:\s*[-/]\s*\d{1,4})?$/.test(answer.trim());
    const pool=GEO.history.map(x=>String(x[2]??x[0])).filter(x=>x!==answer).filter(x=>isDate===/^\d{3,4}(?:\s*[-/]\s*\d{1,4})?$/.test(x.trim()));
    const opts=shuffle127([answer,...shuffle127(pool).slice(0,3)]);
    q.textContent=item[1];
    const r=card.querySelector('.geoResult');if(r)r.textContent='';
    renderOptions127(o,opts,answer,setupHistory127);
  }

  function setupInstruments127(){
    const q=el('#geoInstQuestion'),o=el('#geoInstOptions'),card=document.getElementById('geoInst');
    if(!q||!o||!card||!Array.isArray(GEO.instruments)||!GEO.instruments.length)return;
    const item=GEO.instruments[Math.floor(Math.random()*GEO.instruments.length)];
    const answer=String(item[2]??item[0]);
    const pool=GEO.instruments.map(x=>String(x[2]??x[0])).filter(x=>norm127(x)!==norm127(answer));
    const opts=shuffle127([answer,...shuffle127(pool).slice(0,3)]);
    q.textContent=item[1];
    const r=card.querySelector('.geoResult');if(r)r.textContent='';
    renderOptions127(o,opts,answer,setupInstruments127);
  }

  function setupRelief127(){
    const card=document.getElementById('geoRelief');
    const q=el('#geoReliefQuestion92')||el('#geoReliefQuestion');
    const o=el('#geoReliefOptions92')||el('#geoReliefOptions');
    if(!q||!o||!card)return;
    const rows=[
      ['Everest','¿Cuál es la montaña más alta de la Tierra sobre el nivel del mar?'],
      ['Andes','¿Qué gran cordillera se extiende por el oeste de América del Sur?'],
      ['Himalaya','¿En qué cordillera se encuentra el monte Everest?'],
      ['Pirineos','¿Qué cordillera forma gran parte de la frontera natural entre España y Francia?'],
      ['Teide','¿Cuál es la montaña más alta de España?'],
      ['Mulhacén','¿Cuál es el pico más alto de la península ibérica?'],
      ['Alpes','¿Qué gran cordillera europea atraviesa países como Francia, Suiza, Italia y Austria?'],
      ['Montañas Rocosas','¿Qué gran cordillera recorre el oeste de América del Norte?'],
      ['Atlántico','¿Qué océano separa principalmente América de Europa y África?'],
      ['Pacífico','¿Cuál es el océano más extenso de la Tierra?'],
      ['Índico','¿Qué océano se encuentra entre África, Asia y Australia?'],
      ['Mediterráneo','¿Qué mar se encuentra entre Europa, África y Asia?'],
      ['Cantábrico','¿Qué mar baña la costa norte de España?'],
      ['Mar del Norte','¿Qué mar se encuentra entre Gran Bretaña y Europa continental?'],

    ];
    const item=rows[Math.floor(Math.random()*rows.length)],answer=item[0];
    const opts=shuffle127([answer,...shuffle127(rows.filter(x=>x[0]!==answer)).slice(0,3).map(x=>x[0])]);
    q.textContent=item[1];
    const r=card.querySelector('.geoResult');if(r)r.textContent='';
    card.querySelectorAll('#geoReliefNew92, #geoRelief button[id*=\"New\"]').forEach(x=>x.remove());
    renderOptions127(o,opts,answer,setupRelief127);
  }

  function setupIT127(){
    const root=document.getElementById('lnInfoTerms116');if(!root||typeof INFO116==='undefined'||!Array.isArray(INFO116)||!INFO116.length)return;
    const item=INFO116[Math.floor(Math.random()*INFO116.length)],answer=item[0];

    root.innerHTML='<div class="lnInfoQuestion116"><b>¿Qué término informático corresponde a esta descripción?</b><div class="lnInfoDefinition116">'+esc127(item[1])+'</div></div><div class="lnInfoOpts116">'+opts.map((x,i)=>'<button type="button" class="btn secondary lnInfoOpt116" data-i="'+i+'">'+esc127(x)+'</button>').join('')+'</div><div class="lnInfoResult116"></div>';
    root.querySelectorAll('.lnInfoOpt116').forEach(btn=>btn.onclick=function(){

    const select=card.querySelector('#geoRiverType');if(select){const label=select.previousElementSibling;if(label&&label.tagName==='LABEL')label.remove();select.remove();}

  function setupFinalSuper127(){

  const oldRender127=window.render;
  window.render=function(){
    removeWorldMapNav127();

<script>
/* ===== Minotes v128: Superconocimiento final + acceso Google Maps ===== */
(function(){
  const DELAY=2000;
  function resultText(box,ok){ if(box) box.textContent=ok?'Correcto.':'Incorrecto.'; }
  function answerAndNext(btn,answer,correct,nextFn){
    const opts=btn.parentElement; opts.querySelectorAll('button').forEach(b=>b.disabled=true);
    const box=opts.parentElement.querySelector('.geoResult');
    resultText(box,answer===correct);
    setTimeout(nextFn,DELAY);
  }
  function patchTopic(id,qfn,afn){
    window[afn]=function(btn,a,c){answerAndNext(btn,a,c,()=>window[qfn]());};
  }
  /* Ríos: nombre corto y respuesta funcional */
  window.geoRiver=function(){
    const rows=GEO.rivers||GEO.riversSpain||[]; if(!rows.length)return;
    const q=rows[Math.floor(Math.random()*rows.length)];
    const answer=q[0], question=q[1]||('¿En qué comunidad autónoma se encuentra '+answer+'?');
    const opts=[answer,...rows.map(x=>x[0]).filter(x=>x!==answer).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);
    const qe=el('#geoRQuestion'),oe=el('#geoROptions'); if(!qe||!oe)return;
    qe.textContent=question;
    oe.innerHTML=opts.map(o=>`<button type="button" class="btn secondary">${esc(o)}</button>`).join('');
    oe.querySelectorAll('button').forEach(b=>b.onclick=function(){answerAndNext(this,this.textContent,answer,window.geoRiver);});
  };
  /* Reemplazar el encabezado visible de Superconocimiento y conservar los bloques existentes. */
  const oldSuper=window.supergeo;
  window.supergeo=function(){
    let h=oldSuper();
    h=h.replace(/Supergeografía/g,'Superconocimiento').replace(/Ríos de España/g,'Ríos');
    return h;
  };
  /* Inicio: solo cambia el título de la pregunta. */
  const oldHome=window.home;
  if(oldHome){
    window.home=function(){ return oldHome().replace(/Pregunta de Supergeografía/g,'Pregunta de Superconocimiento'); };
  }
  /* Historia, relieve y aparatos: formato limpio como Capitales y 2 s. */
  function stable(id,rows,qi,ai){
    if(!rows||!rows.length)return;
    const q=rows[Math.floor(Math.random()*rows.length)], answer=q[ai];
    const qe=el('#'+id+'Question'),oe=el('#'+id+'Options'); if(!qe||!oe)return;
    const opts=[answer,...rows.map(x=>x[ai]).filter(x=>x!==answer).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);
    qe.textContent=q[qi]; oe.innerHTML=opts.map(o=>`<button type="button" class="btn secondary">${esc(firstUpper(o))}</button>`).join('');
    oe.querySelectorAll('button').forEach(b=>b.onclick=function(){answerAndNext(this,this.textContent,firstUpper(answer),()=>stable(id,rows,qi,ai));});
  }
  window.geoHistory=function(){stable('geoHist',GEO.history||[],1,0)};
  window.geoInstrument=function(){stable('geoInst',GEO.instruments||[],1,0)};
  /* Montañas/mares/océanos usa su propio dataset si existe. */
  window.renderRelief84=window.renderRelief84||function(){};
  function relief(){
    const rows=GEO.relief||GEO.mountains||GEO.seasOceans||[]; if(rows.length)stable('relieve',rows,1,0);
    else if(typeof window.topicQuestion==='function') window.topicQuestion('relieve');
  }
  /* Términos informáticos: resultado exclusivamente Correcto./Incorrecto., sin descripción ni solución. */
  window.setupIT126=function(){
    const data=(window.INFO116||window.TOP?.informatica||window.topicData?.geoIT||[]); if(!data.length)return;
    const q=data[Math.floor(Math.random()*data.length)], answer=q[0], desc=q[1]||q[0];
    const qe=el('#geoITQuestion'),oe=el('#geoITOptions'); if(!qe||!oe)return;
    qe.textContent=desc;
    const pool=data.map(x=>x[0]).filter(x=>x!==answer).sort(()=>Math.random()-.5).slice(0,3);
    [answer,...pool].sort(()=>Math.random()-.5);
    const opts=[answer,...pool].sort(()=>Math.random()-.5);
    oe.innerHTML=opts.map(o=>`<button type="button" class="btn secondary">${esc(o)}</button>`).join('');
    oe.querySelectorAll('button').forEach(b=>b.onclick=function(){
      oe.querySelectorAll('button').forEach(x=>x.disabled=true);
      resultText(oe.parentElement.querySelector('.geoResult'),this.textContent===answer);
      setTimeout(window.setupIT126,DELAY);
    });
  };
  /* Forzar inicialización final después del render del bloque. */
  const oldRender=window.render;
  window.render=function(){
    oldRender();
    if(S.section==='supergeo'){
      setTimeout(()=>{
        window.geoHistory(); window.geoInstrument(); relief();
        if(typeof window.setupIT126==='function')window.setupIT126();
        window.geoRiver();
      },0);
    }
  };
  /* Acceso directo a Google Maps con imagen de mapa mundi en Varios. */
  const oldVarios=window.varios;
  if(oldVarios){

<script>
/* ===== Minotes v145: estadísticas únicas por bloque, sistema aislado definitivo ===== */
(function(){
  const KEY='minotes_superconocimiento_stats_v145';
  const BOX='superKnowledgeStats145';
  const RESET='resetSuperStats145';
  const BLOCKS=['geoCap','geoCCAA','geoRiver','geoBody','geoChem','geoRelief','geoHist','geoInst','geoMath130'];

  function today(){
    const d=new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function fresh(){return {date:today(),answered:[],correct:[]};}
  function load(){
    let s=null;
    try{s=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
    if(!s || s.date!==today() || !Array.isArray(s.answered) || !Array.isArray(s.correct)) s=fresh();
    s.answered=s.answered.filter((id,i,a)=>BLOCKS.includes(id)&&a.indexOf(id)===i);
    s.correct=s.correct.filter((id,i,a)=>s.answered.includes(id)&&a.indexOf(id)===i);
    save(s);
    return s;
  }
  function save(s){try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}}

  function removeLegacyBoxes(){
    ['superKnowledgeStats','superKnowledgeStats130','superKnowledgeStats133'].forEach(id=>{
      const el=document.getElementById(id); if(el) el.remove();
    });
  }
  function ensureBox(){
    if(typeof S==='undefined' || S.section!=='supergeo') return null;
    removeLegacyBoxes();
    let box=document.getElementById(BOX);
    const h=document.querySelector('#page h1');
    if(!box && h){
      box=document.createElement('div');
      box.id=BOX;
      box.className='card';
      box.style.cssText='margin-bottom:12px;text-align:center';
      h.insertAdjacentElement('afterend',box);
    }
    return box;
  }
  function paint(){
    const box=ensureBox(); if(!box)return;
    const s=load(), total=s.answered.length, correct=s.correct.length;
    const pct=total ? correct/total*100 : 0;
    box.innerHTML='<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><b>📊 Porcentaje general de aciertos de hoy</b><button type="button" class="btn secondary" id="'+RESET+'">🔄 Reiniciar desde cero</button></div><div style="font-size:1.35em;margin-top:5px"><b>'+pct.toFixed(1).replace('.',',')+'%</b></div><div class="small">'+correct+' preguntas acertadas de '+total+' respondidas</div>';
  }

  function classify(card){
    if(!card)return null;
    const id=card.id;
    let r='';
    if(id==='geoMath130'){
      const el=document.getElementById('geoMath130Result');
      r=String(el?.dataset?.statsResult || el?.textContent || '');
      if(el?.dataset?.statsResult==='correct')return true;
      if(el?.dataset?.statsResult==='incorrect')return false;
    }else if(id==='geoRelief'){
      r=String(document.getElementById('geoReliefResult92')?.textContent || '');
    }else{
      r=String(card.querySelector('.geoResult')?.textContent || '');
    }
    r=r.trim().toLocaleLowerCase('es-ES');
    if(r.startsWith('correcto') || r.includes('¡correcto!') || r.includes('✅ correcto')) return true;
    if(r.startsWith('incorrecto') || r.includes('no es correcto') || r.includes('❌ no')) return false;
    return null;
  }

  function register(card){
    const id=card?.id;
    if(!BLOCKS.includes(id))return;
    const s=load();
    if(s.answered.includes(id))return; // cada bloque, incluido matemáticas, solo una vez al día
    setTimeout(function(){
      const current=load();
      if(current.answered.includes(id))return;
      const result=classify(card);
      if(result===null)return;
      current.answered.push(id);
      if(result===true)current.correct.push(id);
      save(current);
      paint();
    },80);
  }

  function reset(e){
    if(e){e.preventDefault();e.stopPropagation();}
    save(fresh());
    paint();
  }

  if(!window.__minotesStats145Installed){
    window.__minotesStats145Installed=true;
    document.addEventListener('click',function(e){
      if(typeof S==='undefined' || S.section!=='supergeo')return;
      const resetBtn=e.target?.closest?.('#'+RESET);
      if(resetBtn){reset(e);return;}
      const btn=e.target?.closest?.('.geoOptions button, .geoReliefAnswer92, .math130-answer');
      if(!btn)return;
      const card=btn.closest('.geoCard');
      if(card)register(card);
    },false);
  }

  const previousRender=window.render;
  if(typeof previousRender==='function'){
    window.render=function(){
      const result=previousRender.apply(this,arguments);
      setTimeout(paint,350);
      return result;
    };
  }

  window.MinotesV145={load,save,paint,reset,register};
  window.LITTERNOTES_VERSION='v145';
  setTimeout(paint,700);
})();
</script>

    if(reset){e.preventDefault();e.stopPropagation();save({date:today(),answered:[],correct:[]});paint();return;}
  },true);

<script>
/* ===== Minotes v150: Matemáticas exclusivamente en Inicio ===== */
(function(){
  function removeMathFromSuper150(){
    const page=document.getElementById('page');
    if(!page||typeof S==='undefined'||S.section!=='supergeo')return;
    page.querySelectorAll('#geoMath130,#geoMath112').forEach(function(x){
      const card=x.closest('.card'); if(card) card.remove(); else x.remove();
    });
  }
  const oldRender150=window.render;
  if(typeof oldRender150==='function'&&!window.__v150Render){
    window.__v150Render=true;
    window.render=function(){
      const r=oldRender150.apply(this,arguments);
      setTimeout(removeMathFromSuper150,0); setTimeout(removeMathFromSuper150,150); setTimeout(removeMathFromSuper150,500);
      return r;
    };
  }
  function make150(){
    const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
    const fmt=n=>Math.abs(n-Math.round(n))<1e-10?String(Math.round(n)):String(Number(n.toFixed(2))).replace('.',',');
    const type=rnd(1,10); let q='',ans='',steps='',opts=[];
    if(type===1){const a=rnd(-15,15),b=rnd(-15,15);ans=fmt(a+b);q=`Calcula: ${a} + (${b})`;steps=`${a} + (${b}) = ${ans}`;opts=[ans,fmt(a-b),fmt(Math.abs(a)+Math.abs(b)),fmt(-(a+b))];}
    else if(type===2){const a=rnd(-15,15),b=rnd(-15,15);ans=fmt(a-b);q=`Calcula: ${a} − (${b})`;steps=`${a} − (${b}) = ${a} + (${-b}) = ${ans}`;opts=[ans,fmt(a+b),fmt(b-a),fmt(Math.abs(a-b))];}
    else if(type===3){const a=rnd(-9,9)||3,b=rnd(-9,9)||-2;ans=fmt(a*b);q=`Calcula: ${a} × (${b})`;steps=`${a} × (${b}) = ${ans}`;opts=[ans,fmt(a+b),fmt(a-b),fmt(-a*b)];}
    else if(type===4){const b=rnd(2,9),a=rnd(-9,9)*b;ans=fmt(a/b);q=`Calcula: ${a} ÷ ${b}`;steps=`${a} ÷ ${b} = ${ans}`;opts=[ans,fmt(a*b),fmt(a-b),fmt(b/a)];}
    else if(type===5){const a=rnd(2,6),b=rnd(2,5),c=rnd(1,9);ans=fmt(a+b*c);q=`Calcula: ${a} + ${b} × ${c}`;steps=`Primero ${b} × ${c} = ${b*c}; después ${a} + ${b*c} = ${ans}`;opts=[ans,fmt((a+b)*c),fmt(a+b+c),fmt(a*b+c)];}
    else if(type===6){const a=rnd(2,5),b=rnd(2,4);ans=fmt(Math.pow(a,b));q=`Calcula: ${a}<sup>${b}</sup>`;steps=`${a}<sup>${b}</sup> = ${Array(b).fill(a).join(' × ')} = ${ans}`;opts=[ans,fmt(a*b),fmt(a+b),fmt(Math.pow(a,b-1))];}
    else if(type===7){const a=rnd(10,90),p=rnd(5,50);ans=fmt(a*p/100);q=`Calcula el ${p}% de ${a}`;steps=`${p}% de ${a} = ${a} × ${p}/100 = ${ans}`;opts=[ans,fmt(a+p),fmt(a-p),fmt(a*p)];}
    else if(type===8){const a=rnd(2,8),b=rnd(2,8),c=rnd(1,8);ans=fmt((a+b)*c);q=`Calcula: (${a} + ${b}) × ${c}`;steps=`Primero ${a} + ${b} = ${a+b}; después ${a+b} × ${c} = ${ans}`;opts=[ans,fmt(a+b*c),fmt(a+b+c),fmt(a*b+c)];}
    else if(type===9){const a=rnd(2,9),b=rnd(2,9),c=rnd(1,9);ans=fmt(a*b+c);q=`Calcula: ${a} × ${b} + ${c}`;steps=`Primero ${a} × ${b} = ${a*b}; después ${a*b} + ${c} = ${ans}`;opts=[ans,fmt(a*(b+c)),fmt((a+b)*c),fmt(a+b+c)];}
    else {const a=rnd(2,9),b=rnd(2,9);ans=fmt(a+b);q=`Calcula: ${a} + ${b}`;steps=`${a} + ${b} = ${ans}`;opts=[ans,fmt(a-b),fmt(a*b),fmt(Math.abs(a-b))];}
    opts=[...new Set(opts.map(String))]; while(opts.length<4)opts.push(fmt((Number(ans.replace(',','.'))||0)+rnd(1,9))); opts=opts.slice(0,4).sort(()=>Math.random()-.5);
    return {q,ans,steps,opts};
  }
  function initHomeMath150(){
